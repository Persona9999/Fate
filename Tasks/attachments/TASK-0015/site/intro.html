<body>
<canvas id="c" width="1280" height="720"></canvas>
<script src="bh/physics.js"></script>
<script src="bh/shader.js"></script>
<script src="bh/renderer.js"></script>

<script>
// 「跳进黑洞，会看到什么？」——本小姐（Claude）讲、大肥鱼问。
// 上面 548px 的画面是黑洞模拟本身：bh/ 底下是 tim099/BlackHole 的 physics／shader／renderer／camera／bodies（原样抄过来，没有改），
// 每一格都用显卡沿着光线往回追，当场算；这一页只负责摆镜头、丢东西、在上面画标注。下面是对话框。
// 模拟照影片时间一格一格往前推（每格 1/30 秒）⇒ 「只抽格」（?shots=1）与正式录影看到的是同一个状态。
// 台词与时间轴从 timeline_cn.json 来。录影用 MediaRecorder（canvas ＋ WebAudio 合成音）；录完把 intro.webm、thumb.png、抽样画面 POST 回本机服务器。
// ?measure=1：不录影，只把影片里用到的数字量一遍、印出来（README 的依据）。
// ⚠ 大肥鱼的台词是本小姐写的，不是 DeepSeek 的实际输出。
const QS = new URLSearchParams(location.search), LANG = QS.get('lang') === 'tw' ? 'tw' : 'cn';
const T = (cn, tw) => LANG === 'tw' ? tw : cn;                  // 画面上的字：?lang=cn 简体（B 站）、?lang=tw 繁中（YouTube）。语音两版共用，繁中版的字幕照念的字转成繁体
const W = 1280, H = 720, SH = 548; let DURATION = 180;
const ORANGE = '#D97757', CREAM = '#F3EDE6', INK = '#16141d', BLUE = '#6fb6f2', RED = '#e0655c', GOLD = '#e6bd62', GREEN = '#5fce8a', PINK = '#f07ab0', DIM = 'rgba(243,237,230,0.66)';
const FONT = LANG === 'tw' ? '"Microsoft JhengHei","Noto Sans TC","PingFang TC","Microsoft YaHei",sans-serif' : '"Microsoft YaHei","Noto Sans SC","PingFang SC","Microsoft JhengHei",sans-serif';
const MONO = 'Consolas,"Cascadia Mono",' + FONT;
const c = document.getElementById('c'), g = c.getContext('2d');
const post = (path, body) => fetch(path, { method: 'POST', body });
const log = m => post('/log', String(m));
window.onerror = (m, s, l) => log('error: ' + m + ' @' + l);

// ── 台词 ──
let LINES = [], LABELS = { O: 'Claude', F: '' }, VOICE = '';
const MAIN_START = 3.5; let OUTRO = 170;
const QUIET = [18, 22];                                        // 第 19～23 句（从 0 数是 18～22）：自己掉进去那一段，配乐换成长音
const N_LINES = 32;
async function loadTimeline() {
  const r = await fetch('timeline_' + LANG + '.json'); if (!r.ok) throw new Error('timeline ' + r.status);
  const tl = await r.json();
  LINES = tl.lines.map(L => ({ at: L.at, dur: L.dur, who: L.who, text: L.zh, shy: L.shy, shake: L.shake, cps: [...L.zh].length / Math.max(0.6, L.dur * 0.85) }));
  OUTRO = tl.outro; DURATION = tl.duration; LABELS = tl.labels || LABELS; VOICE = tl.voice || '';
  if (LINES.length !== N_LINES) throw new Error('lines ' + LINES.length + ' != ' + N_LINES);
  log('timeline(' + LANG + '): ' + LINES.length + ' lines, duration ' + DURATION);
}
const at = i => LINES[i].at, end = i => LINES[i].at + LINES[i].dur;

// ── 音：WebAudio 只接到录影用的 destination ──
const ac = new AudioContext();
const dest = ac.createMediaStreamDestination();
const master = ac.createGain(); master.gain.value = 1; master.connect(dest);
function note(freq, t0, dur, type, vol) {
  const o = ac.createOscillator(), e = ac.createGain();
  o.type = type; o.frequency.value = freq;
  e.gain.setValueAtTime(0, t0);
  e.gain.linearRampToValueAtTime(vol, t0 + 0.01);
  e.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(e); e.connect(master); o.start(t0); o.stop(t0 + dur + 0.02);
}
function thump(t0, v) {
  const o = ac.createOscillator(), e = ac.createGain(); o.type = 'sine';
  o.frequency.setValueAtTime(150, t0); o.frequency.exponentialRampToValueAtTime(52, t0 + 0.16);
  e.gain.setValueAtTime(0.0001, t0); e.gain.linearRampToValueAtTime(0.11 * v, t0 + 0.008); e.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.26);
  o.connect(e); e.connect(master); o.start(t0); o.stop(t0 + 0.3);
}
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
function scheduleMusic(t0) {
  // Am - F - C - G，每个和弦 2.4 秒的琶音（三角波）＋低音。掉进去那一段不弹琶音，换成很小声的长音。
  const s0 = at(QUIET[0]) - 0.6, s1 = at(QUIET[1] + 1) - 0.4;
  const chords = [[57, 60, 64, 69], [53, 57, 60, 65], [60, 64, 67, 72], [55, 59, 62, 67]];
  const order = [0, 1, 2, 3, 2, 1, 2, 1];
  for (let i = 0; i * 0.3 < DURATION - 1.5; i++) {
    const tt = i * 0.3; if (tt > s0 && tt < s1) continue;
    const ch = chords[Math.floor(i / 8) % 4], t = t0 + tt;
    note(hz(ch[order[i % 8]]), t, 0.26, 'triangle', 0.02);
    if (i % 4 === 0) note(hz(ch[0] - 12), t, 0.5, 'sine', 0.02);
  }
  [33, 45, 52].forEach((m, k) => {
    const o = ac.createOscillator(), e = ac.createGain(), v = k ? 0.024 : 0.03; o.type = 'sine'; o.frequency.value = hz(m);
    e.gain.setValueAtTime(0, t0 + s0); e.gain.linearRampToValueAtTime(v, t0 + s0 + 2.5);
    e.gain.setValueAtTime(v, t0 + s1 - 2.0); e.gain.linearRampToValueAtTime(0, t0 + s1 + 0.4);
    o.connect(e); e.connect(master); o.start(t0 + s0); o.stop(t0 + s1 + 0.5);
  });
  thump(t0 + T_CROSS, 1);                                      // 过视界那一刻
  [1.0, 1.4].forEach(s => thump(t0 + s, 0.5));
  master.gain.setValueAtTime(1, t0 + DURATION - 2.6);
  master.gain.linearRampToValueAtTime(0.0001, t0 + DURATION - 0.3);
}

// ── 小工具 ──
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = x => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
const io = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const back = x => { x = clamp(x, 0, 1); const s = 1.7; return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
let GA = 1;
const al = a => { g.globalAlpha = GA * clamp(a, 0, 1); };
function rrect(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function wrap(text, maxW) {
  const out = []; let cur = '';
  const noStart = '、。，．！？：；」』）…～—!?.,)';
  const latin = /[A-Za-z0-9._\/#-]/;
  for (const ch of text) {
    if (ch === '\n') { out.push(cur); cur = ''; continue; }
    if (g.measureText(cur + ch).width > maxW && cur && !noStart.includes(ch)) {
      let cut = cur.length;
      if (latin.test(ch)) { while (cut > 0 && latin.test(cur[cut - 1])) cut--; if (cut === 0) cut = cur.length; }
      out.push(cur.slice(0, cut)); cur = cur.slice(cut) + ch;
    } else cur += ch;
  }
  if (cur) out.push(cur); return out;
}
function heart(x, y, px, color) {
  const m = ['0110110', '1111111', '1111111', '0111110', '0011100', '0001000'];
  g.fillStyle = color;
  m.forEach((row, r) => [...row].forEach((v, k) => { if (v === '1') g.fillRect(x + k * px, y + r * px, px, px); }));
}
function tx(s, x, y, size, col, weight, align, font) {
  g.font = `${weight || 700} ${size}px ${font || FONT}`; g.fillStyle = col; g.textAlign = align || 'left'; g.fillText(s, x, y); g.textAlign = 'left';
}
function panel(x, y, w, h, col, label) {                         // 半透明的深色底板；label ＝ 左上角的小标题
  rrect(x, y, w, h, 12); g.fillStyle = 'rgba(14,12,20,0.84)'; g.fill(); g.lineWidth = 2.5; g.strokeStyle = col || 'rgba(243,237,230,0.3)'; g.stroke();
  if (label) { g.font = `800 20px ${FONT}`; const tw = g.measureText(label).width; rrect(x + 16, y - 16, tw + 28, 34, 8); g.fillStyle = col; g.fill(); g.fillStyle = INK; g.fillText(label, x + 30, y + 8); }
}
function tag(s, x, y, size, col, align) {                      // 一行字＋深色底（盖在模拟画面上也看得清）；x 是左缘（align='center' 时是中心）
  g.font = `800 ${size}px ${FONT}`; const w = g.measureText(s).width + 24, h = size + 16, x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  rrect(x0, y - h + 8, w, h, 8); g.fillStyle = 'rgba(14,12,20,0.82)'; g.fill();
  g.fillStyle = col || CREAM; g.textAlign = 'left'; g.fillText(s, x0 + 12, y); return w;
}
function leader(x0, y0, x1, y1, col) { g.strokeStyle = col; g.lineWidth = 2.5; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); g.beginPath(); g.arc(x1, y1, 4.5, 0, 6.283); g.fillStyle = col; g.fill(); }
function chip(x, y, text, k, size, col) {
  size = size || 26; col = col || ORANGE;
  g.font = `800 ${size}px ${FONT}`; const tw = g.measureText(text).width, w = tw + 36, h = size + 26;
  if (k <= 0) return w;
  const s = back(k); g.save(); g.translate(x + w / 2, y + h / 2); g.scale(s, s);
  rrect(-w / 2, -h / 2, w, h, h / 2); g.fillStyle = 'rgba(14,12,20,0.88)'; g.fill(); g.lineWidth = 3; g.strokeStyle = col; g.stroke();
  g.fillStyle = CREAM; g.textAlign = 'center'; g.fillText(text, 0, size * 0.36); g.textAlign = 'left';
  g.restore(); return w;
}

const load = src => { const im = new Image(); im.src = src; return im; };
const qImg = load('avatar_q.png'), charImg = load('character.jpg'), fishImg = load('fish_full.png'), fishHead = load('fish_head.png');
const ALL_IMG = { qImg, charImg, fishImg, fishHead };
const ok = im => im.complete && im.naturalWidth > 0;
const WHO = {
  O: { col: ORANGE, img: qImg, bg: '#2a2230', right: false },
  F: { col: BLUE, img: fishHead, bg: '#e4f1fd', right: true },
};

// ════════════════════ 黑洞模拟 ════════════════════
const PH = BH.Physics, DEG = Math.PI / 180, SIM_DT = 1 / 30;
const mk = (w, h) => { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; return cv; };
const glc = mk(W, SH), R = new BH.Renderer(glc), gl = R.gl;
const holes = [PH.makeHole({ rs: 1 })];
let cam = new BH.Camera();
const bodies = new BH.Bodies(R, BH.Renderer.TRAJ_N, BH.Renderer.MAX_ROWS);
const sim2d = mk(W, SH), sctx = sim2d.getContext('2d'), snap = mk(W, SH), snctx = snap.getContext('2d'), cmpA = mk(W, SH), cactx = cmpA.getContext('2d');
const SGRA = 4.3e6, SEC = 2.953 * SGRA / 299792.458;              // 人马座 A*：模拟的 1 个时间单位（rs/c）＝几秒
const EPS12 = Math.sqrt(1 - 1 / 12);                              // 从 12 rs 静止放手：E/m

function buildFrame(cf, o, w, h) {
  const rc = Math.hypot(cf.pos[0], cf.pos[1], cf.pos[2]), DT = BH.Renderer.DISK_T;
  let dt = cam.t % DT; if (dt < 0) dt += DT;
  return { width: w || W, height: h || SH, tanFov: Math.tan(cam.fov * DEG / 2), camPos: cf.pos, P: cf.P, camInside: cf.nearHorizon, energyTest: o.energyTest !== false,
    holes, far: Math.max(60, rc * 1.08 + 6), maxSteps: 300, stepScale: 1,
    disk: { on: !!o.disk, rin: 3, rout: 12, brightness: 2.0, thick: 0.08 }, diskTime: dt,
    flags: [1, o.grid ? 1 : 0, 1, 1], exposure: o.exposure || 1, beaconPeriod: 2.0, ghost: o.ghost !== false, debug: !!o.debug,
    bodies: o.noBodies ? [] : bodies.uniforms(cam.t, cf.nearHorizon || cf.ratio < 3) };
}
// 影子的角半径（从「正对黑洞」的方向量）—— Schneider & Perlick, Gen. Rel. Grav. 50, 58 (2018) 式 (32)（悬停）、式 (33)（径向自由落下）；m = rs/2 = 0.5
function psiStatic(r) { const sn = Math.sqrt(27) * 0.5 / r * Math.sqrt(1 - 1 / r); return r >= 1.5 ? Math.asin(sn) : Math.PI - Math.asin(sn); }
function psiFalling(r, eps) {
  const m = 0.5, k = 27 * m * m / (r * r), w = eps * eps - 1 + 2 * m / r;
  const root = Math.sqrt(Math.max(0, w)) * Math.sqrt(Math.max(0, 1 - k * (1 - 2 * m / r)));
  return Math.asin(Math.min(1, Math.sqrt(27) * m / r * (eps + (r > 3 * m ? -1 : 1) * root) / (1 + k * w)));
}
const angPx = a => Math.tan(a) / Math.tan(cam.fov * DEG / 2) * SH / 2;      // 离画面中心几度 ⇒ 几个像素
// 潮汐力：身高 2 米的人头跟脚的加速度差，单位 g。Δa = c² rs L / r³（跟模拟网页右上角的读数是同一条式子）
function tidalG(r, msun) { const m = 2953.25 * msun; return 8.98755e16 * m * 2 / Math.pow(r * m, 3) / 9.80665; }
const fmtG = v => v >= 1e6 ? T('约 ', '約 ') + Math.round(v / 1e6) * 100 + T(' 万 g', ' 萬 g') : v >= 1e4 ? T('约 ', '約 ') + Math.round(v / 1e4) + T(' 万 g', ' 萬 g') : v >= 10 ? Math.round(v) + ' g' : v >= 0.1 ? v.toFixed(1) + ' g' : v >= 0.001 ? v.toFixed(3) + ' g' : v >= 0.00005 ? v.toFixed(4) + ' g' : '不到 0.0001 g';
const fmtSec = s => s < 100 ? s.toFixed(1) + ' 秒' : (s / 60).toFixed(1) + T(' 分钟', ' 分鐘');
function setCam(r, thetaDeg, phi, fov) { cam = new BH.Camera(); cam.r = r; cam.theta = thetaDeg * DEG; cam.phi = phi; cam.fov = fov; }
const camR = () => cam.mode === 'static' ? cam.r : Math.hypot(cam.s[0], cam.s[1], cam.s[2]);
function fallTo(rTarget) {                                      // 从现在悬停的位置静止放手，掉到半径 rTarget
  cam.startFall(holes, 0, 0);
  let n = 0; while (cam.mode === 'fall' && camR() > rTarget + 0.3 && n++ < 100000) cam.advance(holes, 0.05);
  while (cam.mode === 'fall' && camR() > rTarget && n++ < 200000) cam.advance(holes, 0.001);
}
let FALL = null;                                                // 从 12 rs 静止放手：到视界、到模拟终点（r = 0.02 rs）各要多少自己的时间
function fallPlan() {
  if (FALL) return FALL;
  const keep = cam; setCam(12, 74, 0.6, 100); cam.startFall(holes, 0, 0);
  let n = 0; while (cam.mode === 'fall' && n++ < 400000) cam.advance(holes, 0.02);
  FALL = { tc: cam.crossTau - cam.fallTau0, te: cam.tau - cam.fallTau0 }; cam = keep; return FALL;
}
// 低解析度再画两次、相减，找出「画面上哪里因为这个开关而不一样」的重心 ⇒ 方块（或它的第二个像）在画面上的位置
const LW = 640, LH = 274;
function lowres(o) { const px = new Uint8Array(LW * LH * 4); R.draw(buildFrame(cam.frame(holes), o, LW, LH)); gl.readPixels(0, 0, LW, LH, gl.RGBA, gl.UNSIGNED_BYTE, px); return px; }
function centroid(a, b) {
  let sx = 0, sy = 0, sw = 0, n = 0;
  for (let y = 0; y < LH; y++) for (let x = 0; x < LW; x++) { const i = (y * LW + x) * 4, d = Math.abs(a[i] - b[i]) + Math.abs(a[i + 1] - b[i + 1]) + Math.abs(a[i + 2] - b[i + 2]); if (d > 36) { sx += x * d; sy += y * d; sw += d; n++; } }
  return n ? { x: (sx / sw + 0.5) * W / LW, y: SH - (sy / sw + 0.5) * SH / LH, n } : null;
}
function peakBlob(a, b) {
  let best = 0, bx = 0, by = 0, n = 0; const D = new Uint16Array(LW * LH);
  for (let i = 0, j = 0; j < LW * LH; i += 4, j++) { const d = Math.abs(a[i] - b[i]) + Math.abs(a[i + 1] - b[i + 1]) + Math.abs(a[i + 2] - b[i + 2]); D[j] = d; if (d > 36) n++; if (d > best) { best = d; bx = j % LW; by = (j / LW) | 0; } }
  if (best <= 36) return null;
  let sx = 0, sy = 0, sw = 0; const q = 14;
  for (let y = Math.max(0, by - q); y <= Math.min(LH - 1, by + q); y++) for (let x = Math.max(0, bx - q); x <= Math.min(LW - 1, bx + q); x++) { const d = D[y * LW + x]; if (d > 36) { sx += x * d; sy += y * d; sw += d; } }
  return { x: (sx / sw + 0.5) * W / LW, y: SH - (sy / sw + 0.5) * SH / LH, n };
}
function fullDraw(o, ctx) { R.draw(buildFrame(cam.frame(holes), o)); (ctx || sctx).drawImage(glc, 0, 0); }
function zoomInset(x, y, size, src, k, col, label, from) {       // 把模拟画面（或 from 那张）上 src 附近放大 k 倍，画在 (x,y) 的方框里
  const s = size / k; g.save(); rrect(x, y, size, size, 10); g.clip(); g.imageSmoothingEnabled = true; g.fillStyle = '#000'; g.fillRect(x, y, size, size);
  g.drawImage(from || sim2d, src.x - s / 2, src.y - s / 2, s, s, x, y, size, size); g.restore();
  rrect(x, y, size, size, 10); g.lineWidth = 3; g.strokeStyle = col; g.stroke(); tag(label, x + size / 2, y + size + 30, 20, col, 'center');
}
function ring(p, r, col) { g.strokeStyle = col; g.lineWidth = 2.5; g.setLineDash([7, 6]); g.beginPath(); g.arc(p.x, p.y, r, 0, 6.283); g.stroke(); g.setLineDash([]); }

// 从「眼睛」往外射的一排光（真的照测地线算的）：红的被抓住，蓝的到天空。俯视图。
let RAYS = null;
function buildRays() {
  const eye = [12, 0, 0], ks = [0.02, 0.3, 0.6, 0.88, 1.06, 1.3, 1.75, 2.4], out = [];
  ks.forEach(k => [1, -1].forEach(sg => {
    const a = sg * Math.asin(k * PH.B_CRIT * Math.sqrt(1 - 1 / 12) / 12), s = PH.launchLocal(holes, eye, [-1, 0, 0], [0, 0, 1], a, 1, 'light');
    const tr = PH.trace(holes, s, { tSpan: 60, rMax: 15, frac: 0.02, maxSteps: 20000 });
    out.push({ X: tr.X, Z: tr.Z, n: tr.n, hit: tr.fate === 'singularity' });
  }));
  RAYS = out;
}
function rayInset(x, y, k) {                                    // k：0→1 光线长出来
  const w = 340, h = 232, sc = 16.5, ox = x + 118, oy = y + h / 2 + 8, X = v => ox + v * sc, Y = v => oy + v * sc;
  panel(x, y, w, h, BLUE, T('俯视：从眼睛往回追的光线', '俯視：從眼睛往回追的光線'));
  g.save(); rrect(x + 3, y + 3, w - 6, h - 6, 10); g.clip();
  RAYS.forEach(r => { const n = Math.max(2, Math.floor(r.n * clamp(k, 0, 1))); g.beginPath(); for (let i = 0; i < n; i++) { i ? g.lineTo(X(r.X[i]), Y(r.Z[i])) : g.moveTo(X(r.X[i]), Y(r.Z[i])); }
    g.strokeStyle = r.hit ? 'rgba(224,101,92,0.95)' : 'rgba(111,182,242,0.95)'; g.lineWidth = 2; g.stroke(); });
  g.beginPath(); g.arc(X(0), Y(0), sc, 0, 6.283); g.fillStyle = '#000'; g.fill(); g.lineWidth = 2; g.strokeStyle = GOLD; g.stroke();
  g.beginPath(); g.arc(X(12), Y(0), 6, 0, 6.283); g.fillStyle = CREAM; g.fill();
  g.restore();
  tx('眼睛', X(12) - 8, Y(0) - 14, 17, CREAM, 700, 'right'); tx('黑洞', X(0), Y(0) + 40, 17, GOLD, 700, 'center');
  tx(T('红：被抓住', '紅：被抓住'), x + 16, y + h - 14, 18, RED, 800); tx(T('蓝：到天空', '藍：到天空'), x + 130, y + h - 14, 18, BLUE, 800);
}

// ── 镜头表（时间轴载入之后才排得出来）──
let SHOTS = [], T_FALL = 0, T_CROSS = 0, T_END = 0;
