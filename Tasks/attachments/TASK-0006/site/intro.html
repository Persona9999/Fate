<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Senate：把酒館接到 Discord（教學影片）</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
// Senate 教學影片「把酒館接到 Discord」：上半是「舞台」（每一句台詞一個場景），下半是本小姐的對話框。
// 畫面全部畫在 canvas 上，錄影用 MediaRecorder（canvas ＋ WebAudio 合成音）。
// 錄完把 intro.webm、thumb.png、抽樣畫面 POST 回本機伺服器（/upload），最後 POST /done。
// ⚠ 舞台上的網址、token、頻道、訊息都是示意（沒有一個是真的）；步驟與指令照 Discord_Install（SCP_Core/Docs~）。
const W = 1280, H = 720; let DURATION = 79.5;
const ORANGE = '#D97757', CREAM = '#F3EDE6', INK = '#16141d', GREEN = '#8fd694', DIM = 'rgba(243,237,230,0.55)';
const FONT = '"Microsoft JhengHei","Noto Sans TC","PingFang TC","Microsoft YaHei",sans-serif';
const MONO = 'Consolas,"Cascadia Mono","Microsoft JhengHei",monospace';
const c = document.getElementById('c'), g = c.getContext('2d');
const post = (path, body) => fetch(path, { method: 'POST', body });
const log = m => post('/log', String(m));
window.onerror = (m, s, l) => log('error: ' + m + ' @' + l);

// ── 固定亂數（每次錄出來一樣） ──
let seed = 20261110;
const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
const stars = Array.from({ length: 140 }, () => ({ x: rnd() * W, y: rnd() * H, s: rnd() < 0.85 ? 2 : 4, sp: 0.6 + rnd() * 2.2, ph: rnd() * 6.28 }));

// ── 台詞（有 timeline.json ⇒ 換成語音排好的時間軸：at／dur／zh／ja） ──
let VOICED = false, shyAt = 70;
let LINES = [
  { at: 4.0, text: "……哼，今天教你把酒館接到 Discord。酒館裡說的話送過去，Discord 上說的話收回來。" },
  { at: 10.0, text: "兩個方向是兩套東西。送出去走 webhook，收進來靠 Bot。\n只要單向，就只裝那一邊。" },
  { at: 16.0, text: "你不用開後台，也不用打指令。對你的 persona 說一聲：\n幫我把酒館接到 Discord。" },
  { at: 22.0, text: "第一件，建 webhook。在要送去的頻道：編輯頻道、整合、Webhook、新 Webhook，然後複製 Webhook 網址。" },
  { at: 28.0, text: "複製好的網址，貼進它替你開的記事本，存檔、關掉。\n不要貼進對話裡。" },
  { at: 34.0, text: "第二件，建 Bot。到 Developer Portal 新增 Application，在 Bot 頁按 Reset Token，複製 token。它只顯示一次。" },
  { at: 40.0, text: "同一頁打開 Message Content Intent。再到 OAuth2 產生邀請網址，勾 bot、檢視頻道、讀取訊息歷史，把 Bot 邀進伺服器。" },
  { at: 46.0, text: "token 和一組你自己取的密碼，一樣貼進記事本。\n密碼要記住，換電腦的時候靠它解開。" },
  { at: 52.0, text: "剩下的交給 persona：\n登記 webhook、綁頻道分類、裝 token、接頻道、打開開關。" },
  { at: 58.0, text: "最後驗證。你在 Discord 說一句話，酒館會多一則；\npersona 在酒館發一則，Discord 上也看得到。" },
  { at: 64.0, text: "記住三件事：裝好之前的訊息不會補進來；每一間酒館用自己的 webhook；token 和網址，永遠不要貼進對話。" },
  { at: 70.0, text: "才、才不是特地為你整理的呢！\n……文件在 senate cmd doc 裡，名字叫 Discord_Install。", shy: true },
].map(L => ({ ...L, dur: 5.5 }));
const CPS = 17;                       // 每秒幾個字（沒有語音時）
const MAIN_START = 3.5; let OUTRO = 76.5;
async function loadTimeline() {
  try {
    const r = await fetch('timeline.json'); if (!r.ok) return;
    const tl = await r.json();
    // 中文打字在語音念到 85% 時打完
    LINES = tl.lines.map(L => ({ at: L.at, dur: L.dur, text: L.zh, ja: L.ja, shy: L.shy, cps: [...L.zh].length / Math.max(1, L.dur * 0.85) }));
    OUTRO = tl.outro; DURATION = tl.duration; VOICED = true;
    log('timeline: ' + LINES.length + ' lines, duration ' + DURATION);
  } catch (e) { log('no timeline: ' + e); }
}

// ── 音：WebAudio 只接到錄影用的 destination（不接喇叭） ──
const ac = new AudioContext();
const dest = ac.createMediaStreamDestination();
const master = ac.createGain(); master.gain.value = 1; master.connect(dest);
function note(freq, t0, dur, type, vol) {
  const o = ac.createOscillator(), e = ac.createGain();
  o.type = type; o.frequency.value = freq;
  e.gain.setValueAtTime(0, t0);
  e.gain.linearRampToValueAtTime(vol, t0 + 0.008);
  e.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(e); e.connect(master); o.start(t0); o.stop(t0 + dur + 0.02);
}
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
function scheduleMusic(t0) {
  // C - G - Am - F，每個和弦 2 秒，八分音符琶音（三角波）＋ 每拍低音（方波）。比自我介紹那支亮一點。
  const chords = [[60, 64, 67, 72], [55, 59, 62, 67], [57, 60, 64, 69], [53, 57, 60, 65]];
  const order = [0, 2, 1, 2, 3, 2, 1, 2];
  for (let i = 0; i * 0.25 < DURATION - 1.5; i++) {
    const ch = chords[Math.floor(i / 8) % 4], t = t0 + i * 0.25, k = VOICED ? 0.55 : 1;
    note(hz(ch[order[i % 8] % 4]), t, 0.22, 'triangle', 0.045 * k);
    if (i % 2 === 0) note(hz(ch[0] - 12), t, 0.3, 'square', 0.018 * k);
  }
  master.gain.setValueAtTime(1, t0 + DURATION - 2.6);
  master.gain.linearRampToValueAtTime(0.0001, t0 + DURATION - 0.3);
}
let blipN = 0;
function blip() { note(560 + ((blipN++ * 37) % 5) * 40, ac.currentTime + 0.005, 0.045, 'square', 0.05); }

// ── 小工具 ──
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = x => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
const back = x => { x = clamp(x, 0, 1); const s = 1.7; return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
let GA = 1;                                                  // 場景整體的透明度；al() 乘上它
const al = a => { g.globalAlpha = GA * clamp(a, 0, 1); };
function rrect(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function wrap(text, maxW) {
  const out = []; let cur = '';
  const noStart = '、。，．！？：；」』）…・ーっゃゅょァィゥェォッャュョ!?.,)';   // 避頭：這些字不准當行首，寧可讓上一行超出一點
  const latin = /[A-Za-z0-9._\/#-]/;                                        // 英數單字不從中間斷：整個字搬到下一行
  for (const ch of text) {
    if (ch === '\n') { out.push(cur); cur = ''; continue; }                     // 指定斷行
    if (g.measureText(cur + ch).width > maxW && cur && !noStart.includes(ch)) {
      let cut = cur.length;
      if (latin.test(ch)) { while (cut > 0 && latin.test(cur[cut - 1])) cut--; if (cut === 0) cut = cur.length; }   // 整行都是英數就照舊斷
      out.push(cur.slice(0, cut)); cur = cur.slice(cut) + ch;
    } else cur += ch;
  }
  if (cur) out.push(cur); return out;
}
const typed = (text, k) => { const ch = [...text]; return ch.slice(0, Math.floor(ch.length * clamp(k, 0, 1) + 1e-6)).join(''); };
function heart(x, y, px, color) {           // 7x6 像素愛心
  const m = ['0110110', '1111111', '1111111', '0111110', '0011100', '0001000'];
  g.fillStyle = color;
  m.forEach((row, r) => [...row].forEach((v, k) => { if (v === '1') g.fillRect(x + k * px, y + r * px, px, px); }));
}

const avatarImg = new Image(); avatarImg.src = 'avatar.png';
const qImg = new Image(); qImg.src = 'avatar_q.png';           // Q 版頭像（Tim 2026-11-10 給的像素圖，裁頭到肩）；對話框旁邊用這張
const charImg = new Image(); charImg.src = 'character.jpg';     // 人物設定圖（Tim 2026-11-10 給的），只用在封面
let avatar = avatarImg;
// 頭像底是純黑 (0,0,0) ⇒ 只把「連到邊緣的純黑」挖成透明，人物內部不動。
function cutout(img) {
  const o = document.createElement('canvas'); o.width = img.naturalWidth; o.height = img.naturalHeight;
  const x = o.getContext('2d'); x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, o.width, o.height), a = d.data, w = o.width, h = o.height;
  const seen = new Uint8Array(w * h), st = [];
  for (let i = 0; i < w; i++) st.push(i, (h - 1) * w + i);
  for (let j = 0; j < h; j++) st.push(j * w, j * w + w - 1);
  let n = 0;
  while (st.length) {
    const p = st.pop(); if (seen[p]) continue; seen[p] = 1;
    if (a[p * 4] !== 0 || a[p * 4 + 1] !== 0 || a[p * 4 + 2] !== 0) continue;
    a[p * 4 + 3] = 0; n++;
    const px = p % w, py = (p - px) / w;
    if (px > 0) st.push(p - 1); if (px < w - 1) st.push(p + 1); if (py > 0) st.push(p - w); if (py < h - 1) st.push(p + w);
  }
  x.putImageData(d, 0, 0); log('cutout transparent px=' + n + ' / ' + w * h);
  return o;
}

// ── 背景與抬頭 ──
function background(t) {
  const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#11101a'); gr.addColorStop(1, '#221b27');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  for (const s of stars) { g.globalAlpha = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph)); g.fillStyle = s.s > 2 ? '#ffd9c7' : CREAM; g.fillRect(Math.round(s.x), Math.round(s.y), s.s, s.s); }
  g.globalAlpha = 1;
}
function hud(t) {
  g.font = '600 18px Consolas, monospace'; g.fillStyle = DIM; g.textAlign = 'left';
  g.fillText('SENATE // discord setup', 32, 40);
  g.textAlign = 'right';
  const rec = 'REC  ' + new Date(t * 1000).toISOString().substr(15, 4);
  g.fillStyle = 'rgba(243,237,230,0.75)'; g.fillText(rec, W - 32, 40);
  if (Math.floor(t * 2) % 2 === 0) { g.fillStyle = '#ff5a4f'; g.beginPath(); g.arc(W - 32 - g.measureText(rec).width - 16, 34, 7, 0, 6.28); g.fill(); }
  g.textAlign = 'left';
}
function title(t) {
  const name = 'Senate';
  const out = ease((t - 3.0) / 0.5);                       // 3.0–3.5 往上退場
  g.save(); g.globalAlpha = 1 - out; g.translate(0, -out * 80);
  g.font = `900 150px ${FONT}`; g.textBaseline = 'alphabetic';
  const total = g.measureText(name).width; let x = (W - total) / 2;
  [...name].forEach((ch, i) => {
    const k = back((t - 0.2 - i * 0.08) / 0.45), y = 340 - (1 - k) * 260;
    g.globalAlpha = (1 - out) * clamp((t - 0.2 - i * 0.08) / 0.2, 0, 1);
    g.fillStyle = ORANGE; g.fillText(ch, x + 6, y + 6);
    g.fillStyle = CREAM; g.fillText(ch, x, y);
    x += g.measureText(ch).width;
  });
  g.globalAlpha = (1 - out) * clamp((t - 1.1) / 0.4, 0, 1);
  g.fillStyle = ORANGE; g.fillRect(W / 2 - 300 * ease((t - 1.1) / 0.6), 376, 600 * ease((t - 1.1) / 0.6), 6);
  g.font = `700 40px ${FONT}`; g.textAlign = 'center'; g.fillStyle = CREAM;
  g.fillText('把酒館接到 Discord', W / 2, 446);
  g.font = `600 26px ${MONO}`; g.fillStyle = DIM;
  g.fillText('串接教學 ─ webhook 與 Bot', W / 2, 500);
  g.textAlign = 'left'; g.restore();
}

// ── 舞台上的零件 ──
function panel(x, y, w, h, label) {
  rrect(x, y, w, h, 12); g.fillStyle = 'rgba(30,25,38,0.92)'; g.fill();
  g.lineWidth = 3; g.strokeStyle = 'rgba(217,119,87,0.8)'; g.stroke();
  if (label) {
    g.font = `800 22px ${FONT}`; const tw = g.measureText(label).width;
    rrect(x + 20, y - 20, tw + 32, 40, 8); g.fillStyle = ORANGE; g.fill();
    g.fillStyle = INK; g.fillText(label, x + 36, y + 8);
  }
}
function chip(x, y, text, k, size) {                       // 會彈出來的小標籤；回傳寬度
  size = size || 26;
  g.font = `800 ${size}px ${FONT}`; const tw = g.measureText(text).width, w = tw + 36, h = size + 26;
  if (k <= 0) return w;
  const s = back(k); g.save(); g.translate(x + w / 2, y + h / 2); g.scale(s, s);
  rrect(-w / 2, -h / 2, w, h, h / 2); g.fillStyle = 'rgba(217,119,87,0.16)'; g.fill(); g.lineWidth = 3; g.strokeStyle = ORANGE; g.stroke();
  g.fillStyle = CREAM; g.textAlign = 'center'; g.fillText(text, 0, size * 0.36); g.textAlign = 'left';
  g.restore(); return w;
}
function envelope(x, y, k) {
  if (k <= 0) return; const s = back(k); g.save(); g.translate(x + 30, y + 20); g.scale(s, s);
  g.fillStyle = CREAM; g.fillRect(-30, -20, 60, 40);
  g.strokeStyle = ORANGE; g.lineWidth = 3; g.beginPath(); g.moveTo(-30, -20); g.lineTo(0, 4); g.lineTo(30, -20); g.stroke();
  g.strokeRect(-30, -20, 60, 40); g.restore();
}
function checkbox(x, y, on, k) {
  g.lineWidth = 3; g.strokeStyle = on ? GREEN : DIM; g.strokeRect(x, y, 22, 22);
  if (on && k > 0) { g.beginPath(); g.moveTo(x + 4, y + 12); g.lineTo(x + 4 + 5 * clamp(k * 2, 0, 1), y + 12 + 6 * clamp(k * 2, 0, 1)); if (k > 0.5) g.lineTo(x + 9 + 10 * clamp(k * 2 - 1, 0, 1), y + 18 - 13 * clamp(k * 2 - 1, 0, 1)); g.stroke(); }
}
function terminal(titleText) {
  const x = 110, y = 74, w = 1060, h = 400;
  rrect(x, y, w, h, 12); g.fillStyle = '#0f0d14'; g.fill(); g.lineWidth = 2; g.strokeStyle = 'rgba(243,237,230,0.28)'; g.stroke();
  g.save(); rrect(x, y, w, h, 12); g.clip(); g.fillStyle = '#2a2433'; g.fillRect(x, y, w, 38); g.restore();
  ['#ff5f56', '#ffbd2e', '#27c93f'].forEach((col, i) => { g.fillStyle = col; g.beginPath(); g.arc(x + 24 + i * 22, y + 19, 7, 0, 6.28); g.fill(); });
  g.font = `600 17px ${MONO}`; g.fillStyle = DIM; g.textAlign = 'center'; g.fillText(titleText, x + w / 2, y + 25); g.textAlign = 'left';
  return { x: x + 30, y: y + 38, w: w - 60, h: h - 38 };
}
function bubble(right, y, text, k, maxW) {                  // 聊天泡泡；回傳高度
  g.font = `700 25px ${FONT}`;
  const lines = wrap(text, maxW), lh = 36, w = Math.max(...lines.map(l => g.measureText(l).width)) + 40, h = lines.length * lh + 22;
  if (k <= 0) return h;
  const x = right ? 1150 - w : 130;
  g.save(); al(k); g.translate(0, (1 - ease(k)) * 16);
  rrect(x, y, w, h, 16); g.fillStyle = right ? ORANGE : 'rgba(52,44,64,0.96)'; g.fill();
  if (!right) { g.lineWidth = 2; g.strokeStyle = 'rgba(243,237,230,0.3)'; g.stroke(); }
  g.fillStyle = right ? INK : CREAM; lines.forEach((l, i) => g.fillText(l, x + 20, y + 38 + i * lh));
  g.restore(); al(1); return h;
}

// ── 這支影片自己的零件 ──
function arrow(x1, y, x2, k, label, sub) {                  // 橫向箭頭（x1 → x2，可以往左），k＝畫到哪
  if (k <= 0) return; k = clamp(k, 0, 1);
  const xe = x1 + (x2 - x1) * ease(k), dir = x2 > x1 ? 1 : -1;
  g.lineWidth = 6; g.strokeStyle = ORANGE; g.beginPath(); g.moveTo(x1, y); g.lineTo(xe, y); g.stroke();
  g.fillStyle = ORANGE; g.beginPath(); g.moveTo(xe + dir * 18, y); g.lineTo(xe - dir * 4, y - 14); g.lineTo(xe - dir * 4, y + 14); g.closePath(); g.fill();
  const cx = (x1 + x2) / 2; g.textAlign = 'center';
  if (label) { g.font = `900 30px ${MONO}`; g.fillStyle = CREAM; g.fillText(label, cx, y - 20); }
  if (sub) { g.font = `600 20px ${FONT}`; g.fillStyle = DIM; g.fillText(sub, cx, y + 40); }
  g.textAlign = 'left';
}
function stepRow(x, y, n, text, k, note) {                  // 編號圓圈＋一行字
  if (k <= 0) return; al(k); const dx = (1 - ease(k)) * 24;
  g.fillStyle = ORANGE; g.beginPath(); g.arc(x + 20 + dx, y - 9, 20, 0, 6.28); g.fill();
  g.font = `900 24px ${MONO}`; g.fillStyle = INK; g.textAlign = 'center'; g.fillText(String(n), x + 20 + dx, y - 1); g.textAlign = 'left';
  g.font = `700 27px ${FONT}`; g.fillStyle = CREAM; g.fillText(text, x + 58 + dx, y);
  if (note) { const tw = g.measureText(text).width; g.font = `600 20px ${FONT}`; g.fillStyle = DIM; g.fillText(note, x + 58 + dx + tw + 18, y - 2); }
  al(1);
}
function notepad(x, y, w, h, file, body, k, masked) {       // 記事本的樣子；body 打字進度 k；masked ⇒ 內容畫成圓點
  rrect(x, y, w, h, 10); g.fillStyle = '#f4f1ec'; g.fill(); g.lineWidth = 2; g.strokeStyle = 'rgba(243,237,230,0.5)'; g.stroke();
  g.save(); rrect(x, y, w, h, 10); g.clip(); g.fillStyle = '#d9d3ca'; g.fillRect(x, y, w, 40); g.restore();
  g.font = `700 19px ${FONT}`; g.fillStyle = INK; g.fillText(file + ' - 記事本', x + 18, y + 27);
  g.font = `600 17px ${FONT}`; g.fillStyle = 'rgba(22,20,29,0.6)'; g.fillText('檔案　編輯　檢視', x + 18, y + 66);
  g.font = `700 24px ${MONO}`; g.fillStyle = INK;
  const s = typed(body, k); g.fillText(s, x + 18, y + 108);
  if (k < 1 && Math.floor(k * 40) % 2 === 0) g.fillRect(x + 20 + g.measureText(s).width, y + 86, 3, 28);
  if (masked && k >= 1) { g.font = `600 18px ${FONT}`; g.fillStyle = 'rgba(22,20,29,0.55)'; g.fillText('（示意：實際內容不會出現在影片裡）', x + 18, y + h - 18); }
}
function toggle(x, y, on) {                                 // 開關；on 0..1
  on = clamp(on, 0, 1);
  rrect(x, y, 64, 32, 16); g.fillStyle = on > 0.5 ? GREEN : 'rgba(243,237,230,0.25)'; g.fill();
  g.fillStyle = CREAM; g.beginPath(); g.arc(x + 16 + 32 * ease(on), y + 16, 12, 0, 6.28); g.fill();
}
function msgRow(x, y, w, who, text, k, tag) {               // 訊息列
  if (k <= 0) return; al(k);
  rrect(x, y + (1 - ease(k)) * 12, w, 66, 10); g.fillStyle = 'rgba(243,237,230,0.08)'; g.fill();
  g.font = `800 19px ${FONT}`; g.fillStyle = ORANGE; g.fillText(who, x + 14, y + 26 + (1 - ease(k)) * 12);
  if (tag) { const tw = g.measureText(who).width; g.font = `600 16px ${MONO}`; g.fillStyle = DIM; g.fillText(tag, x + 14 + tw + 10, y + 25 + (1 - ease(k)) * 12); }
  g.font = `600 21px ${FONT}`; g.fillStyle = CREAM; g.fillText(text, x + 14, y + 54 + (1 - ease(k)) * 12);
  al(1);
}

// ── 場景：每一句台詞一個。p ＝這一句的進度 0..1（語音長度），最後停在 p=1 的樣子 ──
// ⚠ 畫面上的網址、token、頻道名稱、訊息內容都是示意，沒有任何一個是真的；指令的參數名照 senate cmd help discord-relay／discord-bot。
const SCENES = [
  // 0 酒館 ⇄ Discord
  p => {

    SAMPLES = [2.0, ...LINES.flatMap((_, i) => [mid(i), end(i)]), DURATION - 1.4].sort((a, b) => a - b); }
  await Promise.all([document.fonts.load(`700 36px ${FONT}`), new Promise(r => avatarImg.complete ? r() : (avatarImg.onload = r)),
    new Promise(r => charImg.complete ? r() : (charImg.onload = charImg.onerror = r)),
    new Promise(r => qImg.complete ? r() : (qImg.onload = qImg.onerror = r))]);
  avatar = cutout(avatarImg);
  await ac.resume();
  log('audio state=' + ac.state);
  const stream = new MediaStream([...c.captureStream(30).getVideoTracks(), ...dest.stream.getAudioTracks()]);
  const mime = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  log('mime=' + mime);
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8_000_000, audioBitsPerSecond: 128_000 });
  const chunks = []; rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  const stopped = new Promise(r => rec.onstop = r);
  draw(0); rec.start(1000);
  scheduleMusic(ac.currentTime + 0.05);
  const T0 = performance.now() + 50; let frames = 0; const pending = [];
  await new Promise(resolve => {
    const frame = now => {
      const t = Math.max(0, (now - T0) / 1000);
      draw(Math.min(t, DURATION)); frames++;
      while (SAMPLES.length && t >= SAMPLES[0]) { const s = SAMPLES.shift(); pending.push(new Promise(r => c.toBlob(b => post('/upload?name=frame_' + s.toFixed(1).padStart(5, '0') + '.png', b).then(r), 'image/png'))); }
      if (t < DURATION) requestAnimationFrame(frame); else resolve();
    };
    requestAnimationFrame(frame);
  });
  rec.stop(); await stopped; await Promise.all(pending);
  log('frames=' + frames + ' chunks=' + chunks.length);
  await post('/upload?name=intro.webm', new Blob(chunks, { type: mime }));
  thumbnail();
  await new Promise(r => c.toBlob(b => post('/upload?name=thumb.png', b).then(r), 'image/png'));
  await post('/done', 'ok');
}
run().catch(e => { log('fatal: ' + e); post('/done', 'fail'); });
</script>
