<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>大小姐的航海课 #1：三角贸易</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
// B 站「大小姐的航海课 #1：三角贸易」。上面 548px 是「舞台」（地图、历史图片），下面是对话框（本小姐在左、大肥鱼在右）。
// 画面全部画在 canvas 上，录影用 MediaRecorder（canvas ＋ WebAudio 合成音）；录完把 intro.webm、thumb.png、抽样画面 POST 回本机服务器。
// ⚠ 史实与数字的来源写在附件 README；图片的来源与授权在 img/credits.json（都是公有领域或 CC0）。
// ⚠ 中间航程那几句（第 8～13 句）不放会弹的标签、不放吐槽；配乐在那一段换成低音长音。
// ⚠ 大肥鱼的台词是本小姐写的，不是 DeepSeek 的实际输出。
const W = 1280, H = 720, SH = 548; let DURATION = 170;
const ORANGE = '#D97757', CREAM = '#F3EDE6', INK = '#16141d', BLUE = '#6fb6f2', RED = '#d9584f', GOLD = '#e6bd62', DIM = 'rgba(243,237,230,0.62)';
const FONT = '"Microsoft YaHei","Noto Sans SC","PingFang SC","Microsoft JhengHei",sans-serif';
const MONO = 'Consolas,"Cascadia Mono","Microsoft YaHei",monospace';
const c = document.getElementById('c'), g = c.getContext('2d');
const post = (path, body) => fetch(path, { method: 'POST', body });
const log = m => post('/log', String(m));
window.onerror = (m, s, l) => log('error: ' + m + ' @' + l);

let seed = 20261111;
const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
const stars = Array.from({ length: 140 }, () => ({ x: rnd() * W, y: rnd() * H, s: rnd() < 0.85 ? 2 : 4, sp: 0.6 + rnd() * 2.2, ph: rnd() * 6.28 }));

// ── 台词：一律从 timeline.json 来 ──
let LINES = [], LABELS = { O: '本小姐', F: '大肥鱼' }, VOICE = '';
const MAIN_START = 3.5; let OUTRO = 160;
const SERIOUS = [7, 12];                                       // 第 8～13 句（从 0 数是 7～12）：中间航程，不开玩笑
async function loadTimeline() {
  const r = await fetch('timeline.json'); if (!r.ok) throw new Error('timeline.json ' + r.status);
  const tl = await r.json();
  LINES = tl.lines.map(L => ({ at: L.at, dur: L.dur, who: L.who, text: L.zh, shy: L.shy, cps: [...L.zh].length / Math.max(0.6, L.dur * 0.85) }));
  OUTRO = tl.outro; DURATION = tl.duration; LABELS = tl.labels || LABELS; VOICE = tl.voice || '';
  log('timeline: ' + LINES.length + ' lines, duration ' + DURATION);
}

// ── 音：WebAudio 只接到录影用的 destination ──
const ac = new AudioContext();
const dest = ac.createMediaStreamDestination();
const master = ac.createGain(); master.gain.value = 1; master.connect(dest);
function note(freq, t0, dur, type, vol) {
  const o = ac.createOscillator(), e = ac.createGain();
  o.type = type; o.frequency.value = freq;
  e.gain.setValueAtTime(0, t0);
  e.gain.linearRampToValueAtTime(vol, t0 + 0.01);
  e.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(e); e.connect(master); o.start(t0); o.stop(t0 + dur + 0.02);
}
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
function scheduleMusic(t0) {
  // Dm - Bb - F - C，每个和弦 2.4 秒的琶音（三角波）＋低音。中间航程那一段不弹琶音，换成很小声的低音长音。
  const s0 = LINES[SERIOUS[0]].at - 0.6, s1 = LINES[SERIOUS[1] + 1].at - 0.4;
  const chords = [[62, 65, 69, 74], [58, 62, 65, 70], [65, 69, 72, 77], [60, 64, 67, 72]];
  const order = [0, 1, 2, 3, 2, 1, 2, 1];
  for (let i = 0; i * 0.3 < DURATION - 1.5; i++) {
    const tt = i * 0.3; if (tt > s0 && tt < s1) continue;
    const ch = chords[Math.floor(i / 8) % 4], t = t0 + tt;
    note(hz(ch[order[i % 8]]), t, 0.26, 'triangle', 0.024);
    if (i % 4 === 0) note(hz(ch[0] - 12), t, 0.5, 'sine', 0.022);
  }
  [38, 45].forEach(m => {
    const o = ac.createOscillator(), e = ac.createGain(); o.type = 'sine'; o.frequency.value = hz(m);
    e.gain.setValueAtTime(0, t0 + s0); e.gain.linearRampToValueAtTime(0.03, t0 + s0 + 2.5);
    e.gain.setValueAtTime(0.03, t0 + s1 - 2.0); e.gain.linearRampToValueAtTime(0, t0 + s1 + 0.4);
    o.connect(e); e.connect(master); o.start(t0 + s0); o.stop(t0 + s1 + 0.5);
  });
  master.gain.setValueAtTime(1, t0 + DURATION - 2.6);
  master.gain.linearRampToValueAtTime(0.0001, t0 + DURATION - 0.3);
}

// ── 小工具 ──
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = x => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
const io = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const back = x => { x = clamp(x, 0, 1); const s = 1.7; return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
let GA = 1;
const al = a => { g.globalAlpha = GA * clamp(a, 0, 1); };
function rrect(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function wrap(text, maxW) {
  const out = []; let cur = '';
  const noStart = '、。，．！？：；」』）…～—!?.,)';
  const latin = /[A-Za-z0-9._\/#-]/;
  for (const ch of text) {
    if (ch === '\n') { out.push(cur); cur = ''; continue; }
    if (g.measureText(cur + ch).width > maxW && cur && !noStart.includes(ch)) {
      let cut = cur.length;
      if (latin.test(ch)) { while (cut > 0 && latin.test(cur[cut - 1])) cut--; if (cut === 0) cut = cur.length; }
      out.push(cur.slice(0, cut)); cur = cur.slice(cut) + ch;
    } else cur += ch;
  }
  if (cur) out.push(cur); return out;
}
function heart(x, y, px, color) {
  const m = ['0110110', '1111111', '1111111', '0111110', '0011100', '0001000'];
  g.fillStyle = color;
  m.forEach((row, r) => [...row].forEach((v, k) => { if (v === '1') g.fillRect(x + k * px, y + r * px, px, px); }));
}
const lerp = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);

const load = src => { const im = new Image(); im.src = src; return im; };
const qImg = load('avatar_q.png'), charImg = load('character.jpg'), fishImg = load('fish_full.png'), fishHead = load('fish_head.png');
const earth = load('img/earth.jpg'), cantino = load('img/cantino.jpg'), brookes = load('img/brookes.jpg'), antigua = load('img/antigua.jpg');
const equiano = load('img/equiano.jpg'), elmina = load('img/elmina.jpg'), shipImg = load('img/ship.jpg');
const ALL_IMG = { qImg, charImg, fishImg, fishHead, earth, cantino, brookes, antigua, equiano, elmina, shipImg };
const ok = im => im.complete && im.naturalWidth > 0;

// ── 地图：NASA Blue Marble（等距圆柱投影），裁出大西洋、调成旧地图的颜色，预先画到一张离屏画布上 ──
const MAPK = 8, LON0 = -110, MAP_TOP0 = 62, MAP_H = 800; let mapCv = null, MAP_TOP = 62;
function buildMap() {
  mapCv = document.createElement('canvas'); mapCv.width = W; mapCv.height = MAP_H; const m = mapCv.getContext('2d');
  const k = earth.naturalWidth / 360;
  m.drawImage(earth, (LON0 + 180) * k, (90 - MAP_TOP0) * k, (W / MAPK) * k, (MAP_H / MAPK) * k, 0, 0, W, MAP_H);
  // 卫星影像的海几乎是黑的 ⇒ 逐个像素重新上色：海 ＝ 暗的蓝绿（越浅的海越亮），陆地 ＝ 偏旧纸的褐色
  const id = m.getImageData(0, 0, W, MAP_H), d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i], gg = d[i + 1], b = d[i + 2], lum = 0.3 * r + 0.59 * gg + 0.11 * b;
    if (b > r + 6 && b > gg - 4 && (lum < 110 || (b - r > 20 && lum < 150))) {
      const q = clamp(lum / 70, 0, 1); d[i] = 40 + q * 40; d[i + 1] = 70 + q * 44; d[i + 2] = 88 + q * 42;
    } else {
      const sr = 0.393 * r + 0.769 * gg + 0.189 * b, sg = 0.349 * r + 0.686 * gg + 0.168 * b, sb = 0.272 * r + 0.534 * gg + 0.131 * b;
      d[i] = Math.min(255, (sr * 0.6 + r * 0.4) * 0.9 + 34); d[i + 1] = Math.min(255, (sg * 0.6 + gg * 0.4) * 0.9 + 28); d[i + 2] = Math.min(255, (sb * 0.6 + b * 0.4) * 0.9 + 18);
    }
  }
  m.putImageData(id, 0, 0);
}
const XY = (lon, lat) => [(lon - LON0) * MAPK, (MAP_TOP - lat) * MAPK];
function drawMap(dim) {
  al(1); g.drawImage(mapCv, 0, (MAP_TOP0 - MAP_TOP) * MAPK, W, SH, 0, 0, W, SH);
  if (dim > 0) { al(dim); g.fillStyle = '#0a0a10'; g.fillRect(0, 0, W, SH); }
  al(1); g.font = `600 14px ${FONT}`; g.fillStyle = 'rgba(243,237,230,0.5)'; g.textAlign = 'right'; g.fillText('底图：NASA Blue Marble（公有领域）', W - 14, SH - 10); g.textAlign = 'left';
}
function cr(pts, closed, per) {                              // Catmull-Rom 取样成折线（经纬度）
  const out = [], n = pts.length, at = i => closed ? pts[(i + n) % n] : pts[clamp(i, 0, n - 1)];
  for (let i = 0; i < (closed ? n : n - 1); i++) {
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    for (let j = 0; j < per; j++) {
      const t = j / per, t2 = t * t, t3 = t2 * t;
      out.push([0, 1].map(d => 0.5 * (2 * p1[d] + (-p0[d] + p2[d]) * t + (2 * p0[d] - 5 * p1[d] + 4 * p2[d] - p3[d]) * t2 + (-p0[d] + 3 * p1[d] - 3 * p2[d] + p3[d]) * t3)));
    }
  }
  if (!closed) out.push(pts[n - 1].slice()); else out.push(out[0].slice());
  return out;
}
// 北大西洋环流（顺时针）：沿欧洲、非洲往南 → 往西 → 沿美洲往北 → 往东回欧洲
const GYRE = cr([[-14, 44], [-19, 33], [-24, 22], [-36, 15], [-52, 15], [-66, 19], [-76, 26], [-75, 33], [-64, 39], [-48, 43], [-30, 46]], true, 20);
// 三条边（都走在海上）：欧洲 → 西非；西非 → 加勒比（中间航程）；加勒比 → 欧洲
const E1 = cr([[-8, 48], [-14, 36], [-20, 22], [-19, 12], [-13, 5], [-6, 3.5], [-1.5, 4.5]], false, 16);
const E2 = cr([[-1.5, 4.5], [-10, 2.5], [-25, 5], [-45, 10], [-60, 14], [-70, 17]], false, 16);
const E3 = cr([[-70, 17], [-68, 21], [-68, 28], [-60, 36], [-42, 43], [-22, 47], [-8, 48]], false, 16);
const SA = [[-37, -13.5], [12.5, -9]];                       // 巴西（萨尔瓦多外海）↔ 安哥拉（罗安达外海）
function path(pts, k, color, width, dash, off) {
  if (k <= 0) return; const n = Math.max(2, Math.ceil(pts.length * clamp(k, 0, 1)));
  g.beginPath(); for (let i = 0; i < n; i++) { const [x, y] = XY(pts[i][0], pts[i][1]); i ? g.lineTo(x, y) : g.moveTo(x, y); }
  g.lineWidth = width; g.strokeStyle = color; g.lineJoin = 'round'; g.lineCap = 'round'; g.setLineDash(dash || []); g.lineDashOffset = off || 0; g.stroke(); g.setLineDash([]);
}
function arrowAt(pts, f, color, size) {
  const i = clamp(Math.floor(f * (pts.length - 1)), 0, pts.length - 2), [x0, y0] = XY(pts[i][0], pts[i][1]), [x1, y1] = XY(pts[i + 1][0], pts[i + 1][1]);
  g.save(); g.translate(x1, y1); g.rotate(Math.atan2(y1 - y0, x1 - x0)); g.fillStyle = color;
  g.beginPath(); g.moveTo(size, 0); g.lineTo(-size * 0.7, size * 0.7); g.lineTo(-size * 0.7, -size * 0.7); g.closePath(); g.fill(); g.restore();
}
const along = (pts, f) => { const p = pts[clamp(Math.round(f * (pts.length - 1)), 0, pts.length - 1)]; return XY(p[0], p[1]); };
function mapLabel(text, lon, lat, size, color, align) {
  const [x, y] = XY(lon, lat); g.font = `800 ${size}px ${FONT}`; g.textAlign = align || 'center';
  g.lineWidth = 6; g.strokeStyle = 'rgba(10,10,16,0.88)'; g.lineJoin = 'round'; g.strokeText(text, x, y); g.fillStyle = color; g.fillText(text, x, y); g.textAlign = 'left';
}
function dot(lon, lat, r, color) { const [x, y] = XY(lon, lat); g.beginPath(); g.arc(x, y, r + 3, 0, 6.28); g.fillStyle = 'rgba(10,10,16,0.85)'; g.fill(); g.beginPath(); g.arc(x, y, r, 0, 6.28); g.fillStyle = color; g.fill(); }
function shipIcon(x, y, t) {                                 // 小帆船记号
  g.save(); g.translate(x, y + Math.sin(t * 3) * 2);
  g.beginPath(); g.arc(0, -4, 25, 0, 6.28); g.fillStyle = 'rgba(243,237,230,0.94)'; g.fill(); g.lineWidth = 3; g.strokeStyle = INK; g.stroke();
  g.fillStyle = INK; g.beginPath(); g.moveTo(-16, 3); g.lineTo(16, 3); g.lineTo(11, 11); g.lineTo(-11, 11); g.closePath(); g.fill();
  g.strokeStyle = INK; g.lineWidth = 2; g.beginPath(); g.moveTo(-5, 3); g.lineTo(-5, -22); g.moveTo(7, 3); g.lineTo(7, -17); g.stroke();
  g.fillStyle = ORANGE; g.beginPath(); g.moveTo(-14, -19); g.lineTo(-1, -20); g.lineTo(1, -3); g.lineTo(-15, -3); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(3, -15); g.lineTo(13, -15); g.lineTo(14, -3); g.lineTo(2, -3); g.closePath(); g.fill();
  g.restore();
}
function triangle(a, color, width) {
  al(a); path(E1, 1, color, width); path(E2, 1, color, width); path(E3, 1, color, width); al(1);
}
function vertices(a) {
  al(a); dot(-8, 48, 7, CREAM); dot(-1.5, 4.5, 7, CREAM); dot(-70, 17, 7, CREAM);
  mapLabel('欧洲', 3, 45.5, 28, CREAM); mapLabel('西非', 5, 10.5, 28, CREAM); mapLabel('加勒比', -77, 12.5, 28, CREAM); al(1);
}

// ── 图片 ──
function picture(img, crop, dx, dy, dw, dh, caption) {
  if (!ok(img)) return;
  g.save(); g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowBlur = 18; g.fillStyle = '#0c0c10'; g.fillRect(dx, dy, dw, dh); g.restore();
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.drawImage(img, crop[0], crop[1], crop[2], crop[3], dx, dy, dw, dh);
  g.lineWidth = 3; g.strokeStyle = 'rgba(243,237,230,0.85)'; g.strokeRect(dx, dy, dw, dh);
  if (caption) {
    g.font = `600 15px ${FONT}`; const tw = g.measureText(caption).width;
    g.fillStyle = 'rgba(10,10,16,0.8)'; g.fillRect(dx + 1.5, dy + dh - 28, Math.min(dw - 3, tw + 22), 26.5);
    g.fillStyle = CREAM; g.fillText(caption, dx + 12, dy + dh - 9);
  }
}

// ── 背景与抬头 ──
function background(t) {
  const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#0f1019'); gr.addColorStop(1, '#1d1822');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  for (const s of stars) { g.globalAlpha = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph)); g.fillStyle = s.s > 2 ? '#ffd9c7' : CREAM; g.fillRect(Math.round(s.x), Math.round(s.y), s.s, s.s); }
  g.globalAlpha = 1;
}
function hud(t) {
  g.save(); g.shadowColor = 'rgba(0,0,0,0.9)'; g.shadowBlur = 6;
  g.font = '600 17px Consolas, monospace'; g.fillStyle = 'rgba(243,237,230,0.78)'; g.textAlign = 'left';
  g.fillText('OJOUSAMA // 航海课 #1', 20, 28);
  g.textAlign = 'right'; g.font = `600 16px ${FONT}`; g.fillText('三角贸易', W - 20, 28);
  g.restore(); g.textAlign = 'left';
}
function title(t) {
  const name = '大小姐的航海课';
  const out = ease((t - 3.0) / 0.5);
  g.save(); g.globalAlpha = 1 - out; g.translate(0, -out * 80);
  g.font = `900 112px ${FONT}`; g.textBaseline = 'alphabetic';
  const total = g.measureText(name).width; let x = (W - total) / 2 - 70;
  [...name].forEach((ch, i) => {
    const k = back((t - 0.2 - i * 0.07) / 0.45), y = 320 - (1 - k) * 260;
    g.globalAlpha = (1 - out) * clamp((t - 0.2 - i * 0.07) / 0.2, 0, 1);
    g.fillStyle = ORANGE; g.fillText(ch, x + 6, y + 6);
    g.fillStyle = CREAM; g.fillText(ch, x, y);
    x += g.measureText(ch).width;
  });
  g.globalAlpha = (1 - out) * clamp((t - 0.8) / 0.3, 0, 1);
  g.font = `900 112px ${MONO}`; g.fillStyle = ORANGE; g.fillText('#1', x + 24, 320);
  g.globalAlpha = (1 - out) * clamp((t - 1.1) / 0.4, 0, 1);
  g.fillStyle = ORANGE; g.fillRect(W / 2 - 360 * ease((t - 1.1) / 0.6), 356, 720 * ease((t - 1.1) / 0.6), 6);
  g.font = `800 46px ${FONT}`; g.textAlign = 'center'; g.fillStyle = CREAM;
  g.fillText('三角贸易：风画出来的三角形', W / 2, 436);
  g.font = `600 26px ${FONT}`; g.fillStyle = DIM;
  g.fillText('讲课：本小姐　　学生：大肥鱼', W / 2, 494);
  g.textAlign = 'left'; g.restore();
}

// ── 舞台上的零件 ──
function panel(x, y, w, h, label, col) {
  col = col || ORANGE;
  rrect(x, y, w, h, 12); g.fillStyle = 'rgba(24,20,30,0.93)'; g.fill();
  g.lineWidth = 3; g.strokeStyle = col === ORANGE ? 'rgba(217,119,87,0.8)' : col; g.stroke();
  if (label) {
    g.font = `800 22px ${FONT}`; const tw = g.measureText(label).width;
    rrect(x + 20, y - 20, tw + 32, 40, 8); g.fillStyle = col; g.fill();
    g.fillStyle = INK; g.fillText(label, x + 36, y + 8);
  }
}
function chip(x, y, text, k, size, col) {                  // 标签；k<1 时弹出来。回传宽度
  size = size || 26; col = col || ORANGE;
  g.font = `800 ${size}px ${FONT}`; const tw = g.measureText(text).width, w = tw + 36, h = size + 26;
  if (k <= 0) return w;
  const s = back(k); g.save(); g.translate(x + w / 2, y + h / 2); g.scale(s, s);
  rrect(-w / 2, -h / 2, w, h, h / 2); g.fillStyle = 'rgba(18,16,24,0.86)'; g.fill(); g.lineWidth = 3; g.strokeStyle = col; g.stroke();
  g.fillStyle = CREAM; g.textAlign = 'center'; g.fillText(text, 0, size * 0.36); g.textAlign = 'left';
  g.restore(); return w;
}
function chipFade(x, y, text, a, size, col) {              // 不会弹的标签（严肃的段落用）
  g.font = `800 ${size}px ${FONT}`; const w = g.measureText(text).width + 36;
  if (a > 0) { al(a); chip(x, y, text, 1, size, col); al(1); } return w;
}
function quip(right, x, y, text, k, col) {
  if (k <= 0) return; col = col || BLUE;
  g.font = `800 26px ${FONT}`; const w = g.measureText(text).width + 40, h = 54, x0 = right ? x - w : x;
  g.save(); al(k); g.translate(0, (1 - ease(k)) * 14);
  rrect(x0, y, w, h, 18); g.fillStyle = col; g.fill();
  g.fillStyle = INK; g.fillText(text, x0 + 20, y + 36);
  g.restore(); al(1);
}
function fish(cx, baseY, hgt, t, hop) {
  if (!ok(fishImg)) return;
  const w = hgt * fishImg.naturalWidth / fishImg.naturalHeight, bob = hop ? Math.abs(Math.sin(t * 5)) * 12 : Math.sin(t * 2) * 3;
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.drawImage(fishImg, cx - w / 2, baseY - hgt - bob, w, hgt);
}
function dark(col) { al(1); g.fillStyle = col || '#0b0b10'; g.fillRect(0, 0, W, SH); }

// ── 场景 ──

  g.save(); rrect(500, 30, 760, 660, 18); g.clip(); g.translate(500, 30); g.scale(0.84, 0.84); g.translate(-180, 0); MAP_TOP = 62;
  g.drawImage(mapCv, 0, 0); g.fillStyle = 'rgba(10,10,16,0.18)'; g.fillRect(0, 0, W, MAP_H);
  path(E1, 1, GOLD, 12); path(E2, 1, RED, 12); path(E3, 1, GOLD, 12);
  arrowAt(E1, 0.55, GOLD, 22); arrowAt(E2, 0.5, RED, 22); arrowAt(E3, 0.5, GOLD, 22);
  dot(-8, 48, 11, CREAM); dot(-1.5, 4.5, 11, CREAM); dot(-70, 17, 11, CREAM);
  mapLabel('欧洲', 4, 45, 40, CREAM); mapLabel('西非', 6, 11, 40, CREAM); mapLabel('加勒比', -78, 11.5, 40, CREAM);
  g.restore(); rrect(500, 30, 760, 660, 18); g.lineWidth = 5; g.strokeStyle = 'rgba(243,237,230,0.85)'; g.stroke();
  // 左：本小姐
  if (ok(charImg)) {
    g.save(); rrect(20, 30, 460, 420, 18); g.clip(); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high'; g.drawImage(charImg, 60, 40, 650, 594, 20, 30, 460, 420); g.restore();
    rrect(20, 30, 460, 420, 18); g.lineWidth = 5; g.strokeStyle = ORANGE; g.stroke();
  }
  g.font = `900 112px ${FONT}`; g.lineJoin = 'round'; g.lineWidth = 16; g.strokeStyle = '#0d0c12'; g.strokeText('三角贸易', 22, 566); g.fillStyle = ORANGE; g.fillText('三角贸易', 28, 572); g.fillStyle = CREAM; g.fillText('三角贸易', 22, 566);
  g.font = `900 44px ${FONT}`; g.lineWidth = 10; g.strokeText('三角形，是风画的', 26, 632); g.fillStyle = GOLD; g.fillText('三角形，是风画的', 26, 632);
  rrect(24, 650, 392, 50, 10); g.fillStyle = ORANGE; g.fill(); g.font = `900 30px ${FONT}`; g.fillStyle = INK; g.fillText('大小姐的航海课 #1', 44, 686);
}

// ── 录影 ──
let SAMPLES = [];
async function run() {
  await loadTimeline();
  { const mid = i => LINES[i].at + LINES[i].dur * 0.5, end = i => LINES[i].at + LINES[i].dur * 0.98;
    SAMPLES = [2.0, ...LINES.flatMap((_, i) => [mid(i), end(i)]), OUTRO + 2.5].sort((a, b) => a - b); }
  await Promise.all([document.fonts.load(`700 36px ${FONT}`), ...Object.values(ALL_IMG).map(im => new Promise(r => im.complete ? r() : (im.onload = im.onerror = r)))]);
  log('images: ' + Object.entries(ALL_IMG).map(([k, im]) => k + '=' + ok(im)).join(' '));
  if (Object.values(ALL_IMG).some(im => !ok(im))) throw new Error('image missing');
  buildMap();
  if (location.search.includes('shots')) {                    // 快速检查：不录影，只把每个抽样时间点画出来传回去
    for (const s of SAMPLES) { draw(s); await new Promise(r => c.toBlob(b => post('/upload?name=frame_' + s.toFixed(1).padStart(5, '0') + '.png', b).then(r), 'image/png')); }
    thumbnail(); await new Promise(r => c.toBlob(b => post('/upload?name=thumb.png', b).then(r), 'image/png'));
    log('shots=' + SAMPLES.length); await post('/done', 'ok'); return;
  }
  await ac.resume();
  log('audio state=' + ac.state);
  const stream = new MediaStream([...c.captureStream(30).getVideoTracks(), ...dest.stream.getAudioTracks()]);
  const mime = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  log('mime=' + mime);
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 9_000_000, audioBitsPerSecond: 128_000 });
  const chunks = []; rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  const stopped = new Promise(r => rec.onstop = r);
  draw(0); rec.start(1000);
  scheduleMusic(ac.currentTime + 0.05);
  const T0 = performance.now() + 50; let frames = 0; const pending = [];
  await new Promise(resolve => {
    const frame = now => {
      const t = Math.max(0, (now - T0) / 1000);
      draw(Math.min(t, DURATION)); frames++;
      while (SAMPLES.length && t >= SAMPLES[0]) { const s = SAMPLES.shift(); pending.push(new Promise(r => c.toBlob(b => post('/upload?name=frame_' + s.toFixed(1).padStart(5, '0') + '.png', b).then(r), 'image/png'))); }
      if (t < DURATION) requestAnimationFrame(frame); else resolve();
    };
    requestAnimationFrame(frame);
  });
  rec.stop(); await stopped; await Promise.all(pending);
  log('frames=' + frames + ' chunks=' + chunks.length);
  await post('/upload?name=intro.webm', new Blob(chunks, { type: mime }));
  thumbnail();
  await new Promise(r => c.toBlob(b => post('/upload?name=thumb.png', b).then(r), 'image/png'));
  await post('/done', 'ok');
}
run().catch(e => { log('fatal: ' + e); post('/done', 'fail'); });
</script>
