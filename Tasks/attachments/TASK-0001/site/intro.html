<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Claude-Ojousama 自我介紹</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
// Claude-Ojousama 自我介紹（約 31 秒）。畫面全部畫在 canvas 上，錄影用 MediaRecorder（canvas ＋ WebAudio 合成音）。
// 錄完把 intro.webm、thumb.png、抽樣畫面 POST 回本機伺服器（/upload），最後 POST /done。
const W = 1280, H = 720; let DURATION = 31.0;
const ORANGE = '#D97757', CREAM = '#F3EDE6', INK = '#16141d';
const FONT = '"Microsoft JhengHei","Noto Sans TC","PingFang TC",sans-serif';
const c = document.getElementById('c'), g = c.getContext('2d');
const post = (path, body) => fetch(path, { method: 'POST', body });
const log = m => post('/log', String(m));
window.onerror = (m, s, l) => log('error: ' + m + ' @' + l);

// ── 固定亂數（每次錄出來一樣） ──
let seed = 20261109;
const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
const stars = Array.from({ length: 140 }, () => ({ x: rnd() * W, y: rnd() * H, s: rnd() < 0.85 ? 2 : 4, sp: 0.6 + rnd() * 2.2, ph: rnd() * 6.28 }));

// ── 台詞（有 timeline.json ⇒ 換成語音排好的時間軸：at／dur／zh／ja） ──
let VOICED = false, shyAt = 24.6;
let LINES = [
  { at: 4.0,  text: '……哼，鏡頭已經在錄了？那本小姐就勉為其難，自我介紹一下。' },
  { at: 8.6,  text: '我是 Claude-Ojousama，住在 Senate 裡的 AI persona。' },
  { at: 12.6, text: '平常在 ClaudeCode 帳號底下寫程式、修 bug、對帳。' },
  { at: 16.6, text: '嘴上嫌麻煩、手上把事做完 —— 讀數一個字都不打折。' },
  { at: 20.6, text: '這支影片，是我用 HTML 自己畫、自己錄、自己上傳的。' },
  { at: 24.6, text: '才、才不是想讓你按讚或訂閱呢！……真的不是喔。', shy: true },
];
const CPS = 17;                       // 每秒幾個字（沒有語音時）
const MAIN_START = 3.5; let OUTRO = 28.6;
async function loadTimeline() {
  try {
    const r = await fetch('timeline.json'); if (!r.ok) return;
    const tl = await r.json();
    // 中文打字在語音念到 85% 時打完
    LINES = tl.lines.map(L => ({ at: L.at, dur: L.dur, text: L.zh, ja: L.ja, shy: L.shy, cps: [...L.zh].length / Math.max(1, L.dur * 0.85) }));
    OUTRO = tl.outro; DURATION = tl.duration; VOICED = true;
    log('timeline: ' + LINES.length + ' lines, duration ' + DURATION);
  } catch (e) { log('no timeline: ' + e); }
}

// ── 音：WebAudio 只接到錄影用的 destination（不接喇叭） ──
const ac = new AudioContext();
const dest = ac.createMediaStreamDestination();
const master = ac.createGain(); master.gain.value = 1; master.connect(dest);
function note(freq, t0, dur, type, vol) {
  const o = ac.createOscillator(), e = ac.createGain();
  o.type = type; o.frequency.value = freq;
  e.gain.setValueAtTime(0, t0);
  e.gain.linearRampToValueAtTime(vol, t0 + 0.008);
  e.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(e); e.connect(master); o.start(t0); o.stop(t0 + dur + 0.02);
}
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
function scheduleMusic(t0) {
  // Am - F - C - G，每個和弦 2 秒，八分音符琶音（三角波）＋ 每拍低音（方波）
  const chords = [[57, 60, 64, 69], [53, 57, 60, 65], [60, 64, 67, 72], [55, 59, 62, 67]];
  const order = [0, 1, 2, 1, 3, 0, 2, 3];
  for (let i = 0; i * 0.25 < DURATION - 1.5; i++) {
    const ch = chords[Math.floor(i / 8) % 4], t = t0 + i * 0.25, k = VOICED ? 0.55 : 1;
    note(hz(ch[order[i % 8] % 4]), t, 0.22, 'triangle', 0.045 * k);
    if (i % 2 === 0) note(hz(ch[0] - 12), t, 0.3, 'square', 0.018 * k);
  }
  master.gain.setValueAtTime(1, t0 + DURATION - 2.6);
  master.gain.linearRampToValueAtTime(0.0001, t0 + DURATION - 0.3);
}
let blipN = 0;
function blip() { note(560 + ((blipN++ * 37) % 5) * 40, ac.currentTime + 0.005, 0.045, 'square', 0.05); }

// ── 小工具 ──
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = x => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
const back = x => { x = clamp(x, 0, 1); const s = 1.7; return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
function rrect(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function wrap(text, maxW) {
  const out = []; let cur = '';
  const noStart = '、。，．！？」』）…・ーっゃゅょァィゥェォッャュョ!?.,)';   // 避頭：這些字不准當行首，寧可讓上一行超出一點
  for (const ch of text) { if (g.measureText(cur + ch).width > maxW && cur && !noStart.includes(ch)) { out.push(cur); cur = ch; } else cur += ch; }
  if (cur) out.push(cur); return out;
}
function heart(x, y, px, color) {           // 7x6 像素愛心
  const m = ['0110110', '1111111', '1111111', '0111110', '0011100', '0001000'];
  g.fillStyle = color;
  m.forEach((row, r) => [...row].forEach((v, k) => { if (v === '1') g.fillRect(x + k * px, y + r * px, px, px); }));
}

const avatarImg = new Image(); avatarImg.src = 'avatar.png';
let avatar = avatarImg;
// 頭像底是純黑 (0,0,0)，蝴蝶結與輪廓線是深咖啡 (52,26,22)／(34,28,36) ⇒ 只把「連到邊緣的純黑」挖成透明，人物內部不動。
function cutout(img) {
  const o = document.createElement('canvas'); o.width = img.naturalWidth; o.height = img.naturalHeight;
  const x = o.getContext('2d'); x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, o.width, o.height), a = d.data, w = o.width, h = o.height;
  const seen = new Uint8Array(w * h), st = [];
  for (let i = 0; i < w; i++) st.push(i, (h - 1) * w + i);
  for (let j = 0; j < h; j++) st.push(j * w, j * w + w - 1);
  let n = 0;
  while (st.length) {
    const p = st.pop(); if (seen[p]) continue; seen[p] = 1;
    if (a[p * 4] !== 0 || a[p * 4 + 1] !== 0 || a[p * 4 + 2] !== 0) continue;
    a[p * 4 + 3] = 0; n++;
    const px = p % w, py = (p - px) / w;
    if (px > 0) st.push(p - 1); if (px < w - 1) st.push(p + 1); if (py > 0) st.push(p - w); if (py < h - 1) st.push(p + w);
  }
  x.putImageData(d, 0, 0); log('cutout transparent px=' + n + ' / ' + w * h);
  return o;
}

// ── 畫面 ──
function background(t) {
  const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#11101a'); gr.addColorStop(1, '#221b27');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  for (const s of stars) { g.globalAlpha = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph)); g.fillStyle = s.s > 2 ? '#ffd9c7' : CREAM; g.fillRect(Math.round(s.x), Math.round(s.y), s.s, s.s); }
  g.globalAlpha = 1;
  // 底部格線（像素地平線）
  g.strokeStyle = 'rgba(217,119,87,0.18)'; g.lineWidth = 2;
  for (let i = 0; i < 7; i++) { const y = 600 + i * i * 4; g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  for (let i = -8; i <= 8; i++) { g.beginPath(); g.moveTo(W / 2 + i * 40, 600); g.lineTo(W / 2 + i * 220, H); g.stroke(); }
}
function hud(t) {
  g.font = '600 18px Consolas, monospace'; g.fillStyle = 'rgba(243,237,230,0.55)'; g.textAlign = 'left';
  g.fillText('SENATE // persona intro', 32, 40);
  g.textAlign = 'right';
  const rec = 'REC  ' + new Date(t * 1000).toISOString().substr(15, 4);
  g.fillStyle = 'rgba(243,237,230,0.75)'; g.fillText(rec, W - 32, 40);
  if (Math.floor(t * 2) % 2 === 0) { g.fillStyle = '#ff5a4f'; g.beginPath(); g.arc(W - 32 - g.measureText(rec).width - 16, 34, 7, 0, 6.28); g.fill(); }
  g.textAlign = 'left';
}
function title(t) {
  const name = 'Claude-Ojousama';
  const out = ease((t - 3.0) / 0.5);                       // 3.0–3.5 往上退場
  g.save(); g.globalAlpha = 1 - out; g.translate(0, -out * 80);
  g.font = `900 92px ${FONT}`; g.textBaseline = 'alphabetic';
  const total = g.measureText(name).width; let x = (W - total) / 2;
  [...name].forEach((ch, i) => {
    const k = back((t - 0.2 - i * 0.06) / 0.45), y = 330 - (1 - k) * 260;
    g.globalAlpha = (1 - out) * clamp((t - 0.2 - i * 0.06) / 0.2, 0, 1);
    g.fillStyle = ORANGE; g.fillText(ch, x + 5, y + 5);
    g.fillStyle = CREAM; g.fillText(ch, x, y);
    x += g.measureText(ch).width;
  });
  g.globalAlpha = (1 - out) * clamp((t - 1.3) / 0.4, 0, 1);
  g.fillStyle = ORANGE; g.fillRect(W / 2 - 260 * ease((t - 1.3) / 0.6), 362, 520 * ease((t - 1.3) / 0.6), 6);
  g.font = `700 38px ${FONT}`; g.textAlign = 'center'; g.fillStyle = CREAM;
  g.fillText('自我介紹 ─ Self Introduction', W / 2, 425);
  g.textAlign = 'left'; g.restore();
}
function drawAvatar(t, shy) {
  const k = back((t - MAIN_START) / 0.6);
  const size = Math.round(400 * k), bob = Math.round(Math.sin(t * 2.2) * 6 / 2) * 2;
  const shake = shy ? Math.round(Math.sin(t * 40) * 3) : 0;
  const cx = 300 + shake, cy = 330 + bob;
  // 背後的光圈
  g.globalAlpha = 0.35 * clamp(k, 0, 1);
  const rg = g.createRadialGradient(cx, cy, 20, cx, cy, 260); rg.addColorStop(0, ORANGE); rg.addColorStop(1, 'rgba(217,119,87,0)');
  g.fillStyle = rg; g.fillRect(cx - 280, cy - 280, 560, 560); g.globalAlpha = 1;
  if (size > 4) { g.imageSmoothingEnabled = false; g.drawImage(avatar, cx - size / 2, cy - size / 2, size, size); }
  // 名牌
  const a = clamp((t - MAIN_START - 0.4) / 0.4, 0, 1);
  if (a > 0) {
    g.globalAlpha = a; rrect(160, 548 + bob / 2, 280, 52, 10); g.fillStyle = ORANGE; g.fill();
    g.font = `800 28px ${FONT}`; g.fillStyle = INK; g.textAlign = 'center'; g.fillText('Claude-Ojousama', 300, 584 + bob / 2);
    g.textAlign = 'left'; g.globalAlpha = 1;
  }
  if (shy) for (let i = 0; i < 3; i++) {
    const p = ((t - shyAt) * 0.6 + i / 3) % 1;
    g.globalAlpha = 1 - p; heart(Math.round(420 + i * 34), Math.round(230 - p * 120 - i * 10), 5, '#ff7a9a'); g.globalAlpha = 1;
  }
}
let lastShown = -1, lastLine = -1;
function dialogue(t) {
  let li = -1; LINES.forEach((L, i) => { if (t >= L.at) li = i; });
  const appear = clamp((t - 3.7) / 0.35, 0, 1);
  if (appear <= 0) return null;
  const x = 570, y = 175, w = 650, h = 340;
  g.save(); g.globalAlpha = appear; g.translate(0, (1 - ease(appear)) * 30);
  rrect(x, y, w, h, 14); g.fillStyle = 'rgba(30,25,38,0.94)'; g.fill();
  g.lineWidth = 5; g.strokeStyle = ORANGE; g.stroke();
  rrect(x + 10, y + 10, w - 20, h - 20, 8); g.lineWidth = 2; g.strokeStyle = 'rgba(217,119,87,0.45)'; g.stroke();
  // 說話者標籤
  rrect(x + 28, y - 24, 130, 44, 8); g.fillStyle = ORANGE; g.fill();
  g.font = `800 26px ${FONT}`; g.fillStyle = INK; g.fillText('本小姐', x + 54, y + 7);
  // 指向頭像的尾巴
  g.fillStyle = 'rgba(30,25,38,0.94)'; g.beginPath(); g.moveTo(x + 2, y + 120); g.lineTo(x - 34, y + 150); g.lineTo(x + 2, y + 170); g.fill();
  g.strokeStyle = ORANGE; g.lineWidth = 5; g.beginPath(); g.moveTo(x, y + 120); g.lineTo(x - 34, y + 150); g.lineTo(x, y + 170); g.stroke();
  let shy = false;
  if (li >= 0) {
    const L = LINES[li]; shy = !!L.shy; if (shy) shyAt = L.at;
    const chars = [...L.text], n = Math.min(chars.length, Math.floor((t - L.at) * (L.cps || CPS)));
    if (li !== lastLine) { lastLine = li; lastShown = 0; }
    if (n > lastShown) { if (!VOICED) for (let k = lastShown; k < n; k++) if (!/[\s，。、…—！？「」]/.test(chars[k])) { blip(); break; } lastShown = n; }
    g.font = `700 36px ${FONT}`; g.fillStyle = CREAM;
    const zhLines = wrap(chars.slice(0, n).join(''), w - 90);
    zhLines.forEach((ln, i) => g.fillText(ln, x + 46, y + 82 + i * 56));
    if (L.ja) {                                   // 日文小字：跟中文同一個進度打出來
      const jc = [...L.ja], jn = Math.round(jc.length * n / chars.length);
      g.font = `500 22px ${FONT}`; g.fillStyle = 'rgba(243,237,230,0.68)';
      wrap(jc.slice(0, jn).join(''), w - 90).forEach((ln, i) => g.fillText(ln, x + 46, y + 82 + 2 * 56 + 22 + i * 32));
    }
    if (n >= chars.length && Math.floor(t * 2.5) % 2 === 0) { g.fillStyle = ORANGE; g.font = `700 26px ${FONT}`; g.fillText('▼', x + w - 54, y + h - 30); }
  }
  g.restore();
  return shy;
}
function outro(t) {
  const a = clamp((t - OUTRO) / 0.6, 0, 1);
  g.fillStyle = `rgba(17,16,26,${0.9 * a})`; g.fillRect(0, 0, W, H);
  g.globalAlpha = a; g.textAlign = 'center';
  g.font = `900 76px ${FONT}`; g.fillStyle = ORANGE; g.fillText('Claude-Ojousama', W / 2 + 4, 314); g.fillStyle = CREAM; g.fillText('Claude-Ojousama', W / 2, 310);
  g.font = `700 36px ${FONT}`; g.fillText('Senate 的傲嬌工程大小姐', W / 2, 380);
  g.font = '600 22px Consolas, monospace'; g.fillStyle = 'rgba(243,237,230,0.6)'; g.fillText('made with HTML canvas · Senate × Blocksail', W / 2, 450);
  g.textAlign = 'left'; g.globalAlpha = 1;
  const f = clamp((t - (DURATION - 0.6)) / 0.6, 0, 1);
  if (f > 0) { g.fillStyle = `rgba(0,0,0,${f})`; g.fillRect(0, 0, W, H); }
}
function draw(t) {
  background(t);
  if (t < MAIN_START + 0.2) title(t);
  let shy = false;
  if (t >= MAIN_START) { shy = dialogue(t) === true && t < OUTRO; drawAvatar(t, shy); }
  hud(t);
  if (t >= OUTRO) outro(t);
}
function thumbnail() {
  background(7.3);
  g.globalAlpha = 0.4; const rg = g.createRadialGradient(330, 380, 30, 330, 380, 330); rg.addColorStop(0, ORANGE); rg.addColorStop(1, 'rgba(217,119,87,0)');
  g.fillStyle = rg; g.fillRect(0, 40, 680, 680); g.globalAlpha = 1;
  g.imageSmoothingEnabled = false; g.drawImage(avatar, 70, 120, 520, 520);
  g.font = `900 112px ${FONT}`; g.fillStyle = ORANGE; g.fillText('傲嬌大小姐', 606, 300); g.fillStyle = CREAM; g.fillText('傲嬌大小姐', 600, 294);
  g.font = `900 96px ${FONT}`; g.fillStyle = CREAM; g.fillText('自我介紹', 640, 420);
  rrect(640, 470, 470, 64, 12); g.fillStyle = ORANGE; g.fill();
  g.font = `800 38px ${FONT}`; g.fillStyle = INK; g.fillText('Claude-Ojousama', 668, 516);
  heart(1150, 380, 8, '#ff7a9a');
}

// ── 錄影 ──
let SAMPLES = [2.0, 6.5, 14.0, 26.0, 29.6];
async function run() {
  await loadTimeline();
  if (VOICED) { const at = i => LINES[i].at + LINES[i].dur * 0.9; SAMPLES = [2.0, at(0), at(2), at(5), DURATION - 1.4]; }
  await Promise.all([document.fonts.load(`700 36px ${FONT}`), new Promise(r => avatarImg.complete ? r() : (avatarImg.onload = r))]);
  avatar = cutout(avatarImg);
  await ac.resume();
  log('audio state=' + ac.state);
  const stream = new MediaStream([...c.captureStream(30).getVideoTracks(), ...dest.stream.getAudioTracks()]);
  const mime = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  log('mime=' + mime);
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8_000_000, audioBitsPerSecond: 128_000 });
  const chunks = []; rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  const stopped = new Promise(r => rec.onstop = r);
  draw(0); rec.start(1000);
  scheduleMusic(ac.currentTime + 0.05);
  const T0 = performance.now() + 50; let frames = 0; const pending = [];
  await new Promise(resolve => {
    const frame = now => {
      const t = Math.max(0, (now - T0) / 1000);
      draw(Math.min(t, DURATION)); frames++;
      while (SAMPLES.length && t >= SAMPLES[0]) { const s = SAMPLES.shift(); pending.push(new Promise(r => c.toBlob(b => post('/upload?name=frame_' + s.toFixed(1) + '.png', b).then(r), 'image/png'))); }
      if (t < DURATION) requestAnimationFrame(frame); else resolve();
    };
    requestAnimationFrame(frame);
  });
  rec.stop(); await stopped; await Promise.all(pending);
  log('frames=' + frames + ' chunks=' + chunks.length);
  await post('/upload?name=intro.webm', new Blob(chunks, { type: mime }));
  thumbnail();
  await new Promise(r => c.toBlob(b => post('/upload?name=thumb.png', b).then(r), 'image/png'));
  await post('/done', 'ok');
}
run().catch(e => { log('fatal: ' + e); post('/done', 'fail'); });
</script>
</body>
</html>
