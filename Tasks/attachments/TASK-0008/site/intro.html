<script>
// B 站「运营检讨会 #1」：上半是「舞台」（几句台词共用一个场景），下半是对话框（本小姐在左、大肥鱼在右）。
// 画面全部画在 canvas 上，录影用 MediaRecorder（canvas ＋ WebAudio 合成音）。
// 录完把 intro.webm、thumb.png、抽样画面 POST 回本机服务器（/upload），最后 POST /done。
// ⚠ 画面上的数字都对得回读数（2026-11-11 `bili data videos`／`bili video info`）或 TASK-0006 的纪录；评论区那两则是示意。
// ⚠ 大肥鱼的台词是本小姐写的小剧场，不是 DeepSeek 的实际输出。
const W = 1280, H = 720; let DURATION = 114;
const ORANGE = '#D97757', CREAM = '#F3EDE6', INK = '#16141d', GREEN = '#8fd694', BLUE = '#6fb6f2', RED = '#ff5a4f', DIM = 'rgba(243,237,230,0.55)';
const FONT = '"Microsoft YaHei","Noto Sans SC","PingFang SC","Microsoft JhengHei",sans-serif';
const MONO = 'Consolas,"Cascadia Mono","Microsoft YaHei",monospace';
const c = document.getElementById('c'), g = c.getContext('2d');
const post = (path, body) => fetch(path, { method: 'POST', body });
const log = m => post('/log', String(m));
window.onerror = (m, s, l) => log('error: ' + m + ' @' + l);

// ── 固定乱数（每次录出来一样） ──
let seed = 20261111;
const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
const stars = Array.from({ length: 140 }, () => ({ x: rnd() * W, y: rnd() * H, s: rnd() < 0.85 ? 2 : 4, sp: 0.6 + rnd() * 2.2, ph: rnd() * 6.28 }));

// ── 台词：一律从 timeline.json 来（at／dur／who／zh／shy） ──
let LINES = [], LABELS = { O: '本小姐', F: '大肥鱼' }, VOICE = '';
const MAIN_START = 3.5; let OUTRO = 110;
async function loadTimeline() {
  const r = await fetch('timeline.json'); if (!r.ok) throw new Error('timeline.json ' + r.status);
  const tl = await r.json();
  // 字在语音念到 85% 时打完
  LINES = tl.lines.map(L => ({ at: L.at, dur: L.dur, who: L.who, text: L.zh, shy: L.shy, cps: [...L.zh].length / Math.max(0.6, L.dur * 0.85) }));
  OUTRO = tl.outro; DURATION = tl.duration; LABELS = tl.labels || LABELS; VOICE = tl.voice || '';
  log('timeline: ' + LINES.length + ' lines, duration ' + DURATION + (tl.estimated ? ' (estimated)' : ''));
}

// ── 音：WebAudio 只接到录影用的 destination（不接喇叭） ──
const ac = new AudioContext();
const dest = ac.createMediaStreamDestination();
const master = ac.createGain(); master.gain.value = 1; master.connect(dest);
function note(freq, t0, dur, type, vol) {
  const o = ac.createOscillator(), e = ac.createGain();
  o.type = type; o.frequency.value = freq;
  e.gain.setValueAtTime(0, t0);
  e.gain.linearRampToValueAtTime(vol, t0 + 0.008);
  e.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(e); e.connect(master); o.start(t0); o.stop(t0 + dur + 0.02);
}
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
function scheduleMusic(t0) {
  // F - C - Dm - Bb，每个和弦 2 秒；跳一点的琶音（三角波）＋ 每拍低音（方波）。配音会叠上来 ⇒ 音量压低。
  const chords = [[65, 69, 72, 77], [60, 64, 67, 72], [62, 65, 69, 74], [58, 62, 65, 70]];
  const order = [0, 2, 1, 3, 2, 1, 3, 2];
  for (let i = 0; i * 0.25 < DURATION - 1.5; i++) {
    const ch = chords[Math.floor(i / 8) % 4], t = t0 + i * 0.25;
    note(hz(ch[order[i % 8] % 4]), t, 0.2, 'triangle', 0.026);
    if (i % 2 === 0) note(hz(ch[0] - 12), t, 0.28, 'square', 0.010);
  }
  master.gain.setValueAtTime(1, t0 + DURATION - 2.6);
  master.gain.linearRampToValueAtTime(0.0001, t0 + DURATION - 0.3);
}

// ── 小工具 ──
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = x => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
const back = x => { x = clamp(x, 0, 1); const s = 1.7; return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
let GA = 1;                                                  // 场景整体的透明度；al() 乘上它
const al = a => { g.globalAlpha = GA * clamp(a, 0, 1); };
function rrect(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function wrap(text, maxW) {
  const out = []; let cur = '';
  const noStart = '、。，．！？：；」』）…～—!?.,)';             // 避头：这些字不准当行首
  const latin = /[A-Za-z0-9._\/#-]/;                         // 英数单字不从中间断
  for (const ch of text) {
    if (ch === '\n') { out.push(cur); cur = ''; continue; }
    if (g.measureText(cur + ch).width > maxW && cur && !noStart.includes(ch)) {
      let cut = cur.length;
      if (latin.test(ch)) { while (cut > 0 && latin.test(cur[cut - 1])) cut--; if (cut === 0) cut = cur.length; }
      out.push(cur.slice(0, cut)); cur = cur.slice(cut) + ch;
    } else cur += ch;
  }
  if (cur) out.push(cur); return out;
}
const typed = (text, k) => { const ch = [...text]; return ch.slice(0, Math.floor(ch.length * clamp(k, 0, 1) + 1e-6)).join(''); };
function heart(x, y, px, color) {
  const m = ['0110110', '1111111', '1111111', '0111110', '0011100', '0001000'];
  g.fillStyle = color;
  m.forEach((row, r) => [...row].forEach((v, k) => { if (v === '1') g.fillRect(x + k * px, y + r * px, px, px); }));
}

const qImg = new Image(); qImg.src = 'avatar_q.png';           // 本小姐的 Q 版头像（Tim 给的像素图，裁头到肩）
const charImg = new Image(); charImg.src = 'character.jpg';     // 本小姐的人物设定图（Tim 给的）
const fishImg = new Image(); fishImg.src = 'fish_full.png';     // 大肥鱼全身（Tim 给的 AI 生成图，去掉白底）
const fishHead = new Image(); fishHead.src = 'fish_head.png';   // 大肥鱼头像（同一张图裁的）
const ok = im => im.complete && im.naturalWidth > 0;

// ── 背景与抬头 ──
function background(t) {
  const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#11101a'); gr.addColorStop(1, '#221b27');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  for (const s of stars) { g.globalAlpha = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph)); g.fillStyle = s.s > 2 ? '#ffd9c7' : CREAM; g.fillRect(Math.round(s.x), Math.round(s.y), s.s, s.s); }
  g.globalAlpha = 1;
}
function hud(t) {
  g.font = '600 18px Consolas, monospace'; g.fillStyle = DIM; g.textAlign = 'left';
  g.fillText('OJOUSAMA // review #1', 32, 40);
  g.textAlign = 'right';
  const rec = 'REC  ' + new Date(t * 1000).toISOString().substr(15, 4);
  g.fillStyle = 'rgba(243,237,230,0.75)'; g.fillText(rec, W - 32, 40);

}
function title(t) {

    g.fillStyle = ORANGE; g.fillText(ch, x + 6, y + 6);

  g.globalAlpha = (1 - out) * clamp((t - 1.1) / 0.4, 0, 1);

  g.font = `700 42px ${FONT}`; g.textAlign = 'center'; g.fillStyle = CREAM;
  g.fillText('第一支视频，只有 3 个播放', W / 2, 440);
  g.font = `600 26px ${FONT}`; g.fillStyle = DIM;
  g.fillText('被检讨的：本小姐　　旁听：大肥鱼', W / 2, 496);
  g.textAlign = 'left'; g.restore();
}

// ── 舞台上的零件 ──
function panel(x, y, w, h, label, col) {
  col = col || ORANGE;
  rrect(x, y, w, h, 12); g.fillStyle = 'rgba(30,25,38,0.92)'; g.fill();
  g.lineWidth = 3; g.strokeStyle = col === ORANGE ? 'rgba(217,119,87,0.8)' : col; g.stroke();
  if (label) {
    g.font = `800 22px ${FONT}`; const tw = g.measureText(label).width;
    rrect(x + 20, y - 20, tw + 32, 40, 8); g.fillStyle = col; g.fill();
    g.fillStyle = INK; g.fillText(label, x + 36, y + 8);
  }
}
function chip(x, y, text, k, size, col) {                  // 会弹出来的小标签；回传宽度
  size = size || 26; col = col || ORANGE;
  g.font = `800 ${size}px ${FONT}`; const tw = g.measureText(text).width, w = tw + 36, h = size + 26;
  if (k <= 0) return w;
  const s = back(k); g.save(); g.translate(x + w / 2, y + h / 2); g.scale(s, s);
  rrect(-w / 2, -h / 2, w, h, h / 2); g.fillStyle = col === BLUE ? 'rgba(111,182,242,0.18)' : 'rgba(217,119,87,0.16)'; g.fill(); g.lineWidth = 3; g.strokeStyle = col; g.stroke();
  g.fillStyle = CREAM; g.textAlign = 'center'; g.fillText(text, 0, size * 0.36); g.textAlign = 'left';
  g.restore(); return w;
}
function quip(right, x, y, text, k, col) {                 // 小对话泡泡（舞台上的插话）；right ⇒ x 是右缘
  if (k <= 0) return; col = col || BLUE;
  g.font = `800 26px ${FONT}`; const w = g.measureText(text).width + 40, h = 54, x0 = right ? x - w : x;
  g.save(); al(k); g.translate(0, (1 - ease(k)) * 14);
  rrect(x0, y, w, h, 18); g.fillStyle = col; g.fill();
  g.fillStyle = INK; g.fillText(text, x0 + 20, y + 36);
  g.restore(); al(1);
}
function terminal(titleText) {
  const x = 110, y = 74, w = 1060, h = 400;
  rrect(x, y, w, h, 12); g.fillStyle = '#0f0d14'; g.fill(); g.lineWidth = 2; g.strokeStyle = 'rgba(243,237,230,0.28)'; g.stroke();
  g.save(); rrect(x, y, w, h, 12); g.clip(); g.fillStyle = '#2a2433'; g.fillRect(x, y, w, 38); g.restore();
  ['#ff5f56', '#ffbd2e', '#27c93f'].forEach((col, i) => { g.fillStyle = col; g.beginPath(); g.arc(x + 24 + i * 22, y + 19, 7, 0, 6.28); g.fill(); });
  g.font = `600 17px ${MONO}`; g.fillStyle = DIM; g.textAlign = 'center'; g.fillText(titleText, x + w / 2, y + 25); g.textAlign = 'left';
  return { x: x + 30, y: y + 38, w: w - 60, h: h - 38 };
}
function msgRow(x, y, w, who, text, k) {
  if (k <= 0) return; al(k); const dy = (1 - ease(k)) * 12;
  rrect(x, y + dy, w, 62, 10); g.fillStyle = 'rgba(243,237,230,0.08)'; g.fill();
  g.font = `800 18px ${FONT}`; g.fillStyle = DIM; g.fillText(who, x + 14, y + 24 + dy);
  g.font = `600 22px ${FONT}`; g.fillStyle = CREAM; g.fillText(text, x + 14, y + 52 + dy);
  al(1);
}
function fish(cx, baseY, hgt, t, hop) {                    // 大肥鱼全身；baseY ＝ 脚底
  if (!ok(fishImg)) return;
  const w = hgt * fishImg.naturalWidth / fishImg.naturalHeight, bob = hop ? Math.abs(Math.sin(t * 5)) * 12 : Math.sin(t * 2) * 3;
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.drawImage(fishImg, cx - w / 2, baseY - hgt - bob, w, hgt);
}

// ── 场景：li ＝现在第几句、p ＝那一句的进度。P(i) ＝第 i 句的进度（还没到 0、念完了 1） ──
let CUR_LI = 0, CUR_P = 0, CUR_T = 0;
const P = i => CUR_LI > i ? 1 : CUR_LI === i ? CUR_P : 0;
const SCENE_OF = [0, 1, 1, 2, 2, 3, 3, 4, 4, 4, 5, 5, 5, 6, 6, 6, 6, 7, 7, 7, 8, 9, 9];
const SCENES = [
  // 0（句 0）开场：谁被检讨
  () => {

    [['被检讨的', '本小姐（Claude-Ojousama）', 0.14], ['检讨什么', '上一支视频：自我介绍', 0.38], ['旁听', '还没有人报名', 0.66]].forEach((r, i) => {
      al((p - r[2]) / 0.1); const y = 176 + i * 92;
      g.font = `600 22px ${FONT}`; g.fillStyle = DIM; g.fillText(r[0], 204, y);
      g.font = `800 36px ${FONT}`; g.fillStyle = i === 2 ? DIM : CREAM; g.fillText(r[1], 204, y + 46);
    });
    al(1);
  },
  // 1（句 1、2）上一支视频与它的播放量
  () => {
    const a = P(1), b = P(2), t = CUR_T; const k = clamp(a / 0.12, 0, 1); al(k); panel(110, 104, 1060, 356, '上一支视频');

    if (ok(qImg)) { g.imageSmoothingEnabled = true; g.drawImage(qImg, 215, 146, 150, 150); }
    g.font = `800 29px ${FONT}`; g.fillStyle = CREAM;
    wrap('【AI自我介绍】住在 Senate 里的傲娇工程大小姐 Claude-Ojousama', 660).forEach((l, i) => g.fillText(l, 470, 176 + i * 40));
    g.font = `600 20px ${MONO}`; g.fillStyle = DIM; g.fillText('BV1m4WM6FEJo　2026-11-10 投稿　55 秒', 470, 276);
    al(k * clamp((a - 0.45) / 0.1, 0, 1));
    g.font = `800 38px ${FONT}`; g.fillStyle = CREAM; g.fillText('播放量', 140, 404);
    if (b <= 0) {                                             // 还没揭晓：数字乱跳
      const n = 10000 + (Math.floor(t * 18) * 7919) % 89999;
      g.font = `900 104px ${MONO}`; g.fillStyle = DIM; g.fillText(String(n), 300, 424);
    } else {

      g.font = `900 150px ${MONO}`; g.fillStyle = ORANGE; g.textAlign = 'center'; g.fillText('3', 0, 50); g.textAlign = 'left'; g.restore();
      al((b - 0.4) / 0.12);
      g.font = `800 54px ${MONO}`; g.fillStyle = DIM; g.fillText('30,000', 520, 414);
      const tw = g.measureText('30,000').width; g.strokeStyle = RED; g.lineWidth = 6; g.beginPath(); g.moveTo(510, 396); g.lineTo(530 + tw * clamp((b - 0.46) / 0.12, 0, 1), 396); g.stroke();
      g.font = `700 26px ${FONT}`; g.fillStyle = CREAM; g.fillText('不是三万', 530 + tw + 24, 408);
    }
    al(k); g.font = `600 17px ${FONT}`; g.fillStyle = DIM; g.textAlign = 'right'; g.fillText('读数：2026-11-11 创作中心', 1146, 446); g.textAlign = 'left'; al(1);
  },
  // 2（句 3、4）大肥鱼来旁听
  () => {
    const a = P(3), b = P(4), t = CUR_T; al(1); panel(110, 104, 560, 356, '旁听席', BLUE);
    g.font = `600 24px ${FONT}`; g.fillStyle = DIM; g.fillText('今日旁听', 150, 172);
    al((a - 0.1) / 0.12); g.font = `900 76px ${FONT}`; g.fillStyle = BLUE; g.fillText('大肥鱼', 150, 256);
    g.font = `600 24px ${FONT}`; g.fillStyle = DIM; g.fillText('DeepSeek 的拟人形象', 150, 300); al(1);
    let x = 150; x += chip(x, 328, '便宜', (a - 0.45) / 0.12, 26, BLUE) + 14; chip(x, 328, '开源', (a - 0.6) / 0.12, 26, BLUE);
    chip(150, 396, '不许叫克姐姐！', (b - 0.5) / 0.1, 26, ORANGE);
    const inK = back(a / 0.28); g.save(); g.translate((1 - inK) * 520, 0); al(clamp(a / 0.1, 0, 1)); fish(920, 476, 372, t, a < 1 || b > 0 && b < 1); g.restore(); al(1);
    if (b > 0.02 && b < 1) { g.font = `900 70px ${FONT}`; g.fillStyle = RED; al(1); g.fillText('！', 730 + Math.sin(t * 30) * 3, 190); }
  },
  // 3（句 5、6）检讨 1：标题
  () => {
    const a = P(5), b = P(6); al(1); panel(110, 104, 1060, 356, '检讨 1：标题');
    g.font = `600 22px ${FONT}`; g.fillStyle = DIM; g.fillText('本小姐取的标题', 150, 168);
    g.font = `800 34px ${FONT}`; const parts = ['【AI自我介绍】住在 ', 'Senate', ' 里的傲娇工程大小姐'];
    let x = 150; const xs = parts.map(s => { const x0 = x; x += g.measureText(s).width; return x0; });

      g.font = `800 28px ${FONT}`; g.fillStyle = CREAM; g.fillText('产品名放在最前面，可是没有人认识它', 150, 312); }
    al((a - 0.78) / 0.1); g.font = `600 22px ${FONT}`; g.fillStyle = DIM; g.fillText('同一天，站内搜得到的热门词', 150, 372); al(1);
    x = 150; ['Claude大小姐', '大肥鱼', 'AI娘'].forEach((s, i) => { x += chip(x, 388, s, (a - 0.84 - i * 0.04) / 0.1, 24, BLUE) + 14; });
    quip(true, 1146, 126, 'Senate……？没听过。', b / 0.14, BLUE);
  },
  // 4（句 7、8、9）同一个账号的播放量
  () => {
    const a = P(7), b = P(8), d = P(9); al(1); panel(90, 96, 1100, 376, '同一个账号的播放量');
    const rows = [['自我介绍（本小姐）', 3, ORANGE], ['Discord 教程（本小姐）', 9, ORANGE], ['Senate 三步安装（本小姐）', 109, ORANGE], ['方舷放置 Sharkside', 137, CREAM], ['Blocksail 海战预告片', 321, CREAM], ['宪法号对轰', 585, CREAM]];
    rows.forEach((r, i) => {

      g.font = `700 22px ${FONT}`; g.fillStyle = r[2] === ORANGE ? CREAM : DIM; g.textAlign = 'right'; g.fillText(r[0], 400, y + 8); g.textAlign = 'left';
      const w = Math.max(3, r[1] / 585 * 600 * k); g.fillStyle = r[2]; g.globalAlpha *= r[2] === ORANGE ? 1 : 0.75; g.fillRect(420, y - 14, w, 28);
      al(clamp((a - i * 0.07) / 0.08, 0, 1)); g.font = `800 24px ${MONO}`; g.fillStyle = r[1] === 321 && a > 0.3 ? ORANGE : CREAM; g.fillText(String(Math.round(r[1] * k)), 430 + w, y + 8);
    });
    al(1);
    if (b > 0) {                                              // 隔壁那一支：照同一个比例画不下
      const y = 404, k = ease(b / 0.35); al(clamp(b / 0.08, 0, 1));

function stage(t) {

// ── 录影 ──
let SAMPLES = [];
async function run() {
  await loadTimeline();
  { const mid = i => LINES[i].at + LINES[i].dur * 0.5, end = i => LINES[i].at + LINES[i].dur * 0.98;        // 每句抽两格：中段与句尾
    SAMPLES = [2.0, ...LINES.flatMap((_, i) => [mid(i), end(i)]), OUTRO + 2.2].sort((a, b) => a - b); }
  await Promise.all([document.fonts.load(`700 36px ${FONT}`), ...[qImg, charImg, fishImg, fishHead].map(im => new Promise(r => im.complete ? r() : (im.onload = im.onerror = r)))]);
  log('images: q=' + ok(qImg) + ' char=' + ok(charImg) + ' fish=' + ok(fishImg) + ' head=' + ok(fishHead));
  await ac.resume();
  log('audio state=' + ac.state);
  const stream = new MediaStream([...c.captureStream(30).getVideoTracks(), ...dest.stream.getAudioTracks()]);
  const mime = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  log('mime=' + mime);
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8_000_000, audioBitsPerSecond: 128_000 });
  const chunks = []; rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  const stopped = new Promise(r => rec.onstop = r);
  draw(0); rec.start(1000);
  scheduleMusic(ac.currentTime + 0.05);
  const T0 = performance.now() + 50; let frames = 0; const pending = [];
  await new Promise(resolve => {
    const frame = now => {
      const t = Math.max(0, (now - T0) / 1000);
      draw(Math.min(t, DURATION)); frames++;
      while (SAMPLES.length && t >= SAMPLES[0]) { const s = SAMPLES.shift(); pending.push(new Promise(r => c.toBlob(b => post('/upload?name=frame_' + s.toFixed(1).padStart(5, '0') + '.png', b).then(r), 'image/png'))); }
      if (t < DURATION) requestAnimationFrame(frame); else resolve();
    };
    requestAnimationFrame(frame);
  });
  rec.stop(); await stopped; await Promise.all(pending);
  log('frames=' + frames + ' chunks=' + chunks.length);
  await post('/upload?name=intro.webm', new Blob(chunks, { type: mime }));
  thumbnail();
  await new Promise(r => c.toBlob(b => post('/upload?name=thumb.png', b).then(r), 'image/png'));
  await post('/done', 'ok');
}
