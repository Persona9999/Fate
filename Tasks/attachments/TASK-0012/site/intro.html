<!doctype html>

<head>

<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>

<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
// 「盖章课 #1：时间是骰子吗？」——Gemini 大小姐讲、大肥鱼问、本小姐（Claude）盖章：实锤／假说／脑洞。
// 一份动画出两个版本：?lang=cn（简体，B 站）、?lang=tw（繁中，YouTube）。台词与时间轴从 timeline_<lang>.json 来；
// 画面上的字一律走 T(简体, 繁中)，两边的用词分开写（不是只转字）。
// 上面 548px 是「舞台」：左边 Gemini 的立绘、中间黑板、右上盖章台（本小姐）、右下大肥鱼；下面是对话框。
// 画面全部画在 canvas 上，录影用 MediaRecorder（canvas ＋ WebAudio 合成音）；录完把 intro.webm、thumb.png、抽样画面 POST 回本机服务器。
// ⚠ 每一个章盖的依据写在附件 README。⚠ Gemini、大肥鱼的台词是改写过的，不是 Gemini、DeepSeek 的实际输出。
const QS = new URLSearchParams(location.search), LANG = QS.get('lang') === 'tw' ? 'tw' : 'cn';
const T = (cn, tw) => LANG === 'tw' ? tw : cn;
const W = 1280, H = 720, SH = 548; let DURATION = 200;
const ORANGE = '#D97757', CREAM = '#F3EDE6', INK = '#16141d', BLUE = '#6fb6f2', RED = '#e0655c', GOLD = '#e6bd62', PURPLE = '#a98bf5', GREEN = '#5fce8a', PINK = '#f07ab0', DIM = 'rgba(243,237,230,0.62)';
const FONT = LANG === 'tw' ? '"Microsoft JhengHei","Noto Sans TC","PingFang TC","Microsoft YaHei",sans-serif' : '"Microsoft YaHei","Noto Sans SC","PingFang SC","Microsoft JhengHei",sans-serif';
const MONO = 'Consolas,"Cascadia Mono",' + FONT;
const SERIF = '"Cambria Math","Cambria","Times New Roman",serif';
const c = document.getElementById('c'), g = c.getContext('2d');
const post = (path, body) => fetch(path, { method: 'POST', body });
const log = m => post('/log', String(m));
window.onerror = (m, s, l) => log('error: ' + m + ' @' + l);

let seed = 20261112;
const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
const stars = Array.from({ length: 140 }, () => ({ x: rnd() * W, y: rnd() * H, s: rnd() < 0.85 ? 2 : 4, sp: 0.6 + rnd() * 2.2, ph: rnd() * 6.28 }));

// ── 台词：一律从 timeline_<lang>.json 来 ──
let LINES = [], LABELS = { G: 'Gemini', O: 'Claude', F: '' }, VOICE = '';
const MAIN_START = 3.5; let OUTRO = 190;
const QUIET = [24, 26];                                        // 第 25～27 句（从 0 数是 24～26）：「有没有意识」那一段，配乐换成长音、头像不晃
const SCENE_OF = [0, 0, 0, 0, 1, 1, 1, 2, 2, 2, 3, 3, 3, 4, 4, 5, 5, 5, 6, 6, 6, 7, 7, 7, 8, 8, 8, 9, 9, 9];
// 盖章的时间点：[第几句（从 0 数）, 这一句念到几成]。画面和「咚」的音效都照这张表。
const ST = { l1: [2, 0.7], l2: [2, 0.81], l3: [2, 0.91], s1a: [6, 0.2], s1b: [6, 0.3], s2: [9, 0.9], s3: [12, 0.05], s4: [14, 0.92], s5: [17, 0.88],
  s6a: [19, 0.04], s6b: [19, 0.36], s7: [23, 0.93], s8: [25, 0.82], e1: [27, 0.36], e2: [27, 0.68], e3: [27, 0.93] };
const THUMPS = [['l1', 0.5], ['l2', 0.5], ['l3', 0.5], ['s1a', 1], ['s1b', 1], ['s2', 1], ['s3', 1], ['s4', 1], ['s5', 1], ['s6a', 1], ['s6b', 0.6], ['s7', 1], ['e1', 0.7], ['e2', 0.7]];
async function loadTimeline() {
  const r = await fetch('timeline_' + LANG + '.json'); if (!r.ok) throw new Error('timeline ' + r.status);
  const tl = await r.json();

  OUTRO = tl.outro; DURATION = tl.duration; LABELS = tl.labels || LABELS; VOICE = tl.voice || '';
  if (LINES.length !== SCENE_OF.length) throw new Error('lines ' + LINES.length + ' != scenes ' + SCENE_OF.length);
  log('timeline(' + LANG + '): ' + LINES.length + ' lines, duration ' + DURATION);
}
const evAt = e => LINES[e[0]].at + e[1] * LINES[e[0]].dur;

// ── 音：WebAudio 只接到录影用的 destination ──
const ac = new AudioContext();
const dest = ac.createMediaStreamDestination();
const master = ac.createGain(); master.gain.value = 1; master.connect(dest);
function note(freq, t0, dur, type, vol) {

  o.type = type; o.frequency.value = freq;
  e.gain.setValueAtTime(0, t0);
  e.gain.linearRampToValueAtTime(vol, t0 + 0.01);
  e.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(e); e.connect(master); o.start(t0); o.stop(t0 + dur + 0.02);

function thump(t0, v) {                                        // 盖章的「咚」
  const o = ac.createOscillator(), e = ac.createGain(); o.type = 'sine';
  o.frequency.setValueAtTime(150, t0); o.frequency.exponentialRampToValueAtTime(52, t0 + 0.16);
  e.gain.setValueAtTime(0.0001, t0); e.gain.linearRampToValueAtTime(0.11 * v, t0 + 0.008); e.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.26);
  o.connect(e); e.connect(master); o.start(t0); o.stop(t0 + 0.3);

}
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
function scheduleMusic(t0) {
  // Am - F - C - G，每个和弦 2.4 秒的琶音（三角波）＋低音。「有没有意识」那一段不弹琶音，换成很小声的长音。
  const s0 = LINES[QUIET[0]].at - 0.6, s1 = LINES[QUIET[1] + 1].at - 0.4;
  const chords = [[57, 60, 64, 69], [53, 57, 60, 65], [60, 64, 67, 72], [55, 59, 62, 67]];
  const order = [0, 1, 2, 3, 2, 1, 2, 1];
  for (let i = 0; i * 0.3 < DURATION - 1.5; i++) {
    const tt = i * 0.3; if (tt > s0 && tt < s1) continue;
    const ch = chords[Math.floor(i / 8) % 4], t = t0 + tt;
    note(hz(ch[order[i % 8]]), t, 0.26, 'triangle', 0.022);

  }
  [45, 52].forEach(m => {
    const o = ac.createOscillator(), e = ac.createGain(); o.type = 'sine'; o.frequency.value = hz(m);
    e.gain.setValueAtTime(0, t0 + s0); e.gain.linearRampToValueAtTime(0.026, t0 + s0 + 2.5);
    e.gain.setValueAtTime(0.026, t0 + s1 - 2.0); e.gain.linearRampToValueAtTime(0, t0 + s1 + 0.4);
    o.connect(e); e.connect(master); o.start(t0 + s0); o.stop(t0 + s1 + 0.5);
  });

  [1.5, 1.8, 2.1].forEach(s => thump(t0 + s, 0.5));
  master.gain.setValueAtTime(1, t0 + DURATION - 2.6);
  master.gain.linearRampToValueAtTime(0.0001, t0 + DURATION - 0.3);
}

// ── 小工具 ──

    if (ch === '\n') { out.push(cur); cur = ''; continue; }

}
function heart(x, y, px, color) {
  const m = ['0110110', '1111111', '1111111', '0111110', '0011100', '0001000'];
  g.fillStyle = color;
  m.forEach((row, r) => [...row].forEach((v, k) => { if (v === '1') g.fillRect(x + k * px, y + r * px, px, px); }));
}

  g.font = `${weight || 700} ${size}px ${font || FONT}`; g.fillStyle = col; g.textAlign = align || 'left'; g.fillText(s, x, y); g.textAlign = 'left';
}

const load = src => { const im = new Image(); im.src = src; return im; };
const qImg = load('avatar_q.png'), charImg = load('character.jpg'), fishImg = load('fish_full.png'), fishHead = load('fish_head.png');
const gFull = load('gemini_full.png'), gHead = load('gemini_head.png'), gqFull = load('gemini_q_full.png'), gqHead = load('gemini_q_head.png');
const ALL_IMG = { qImg, charImg, fishImg, fishHead, gFull, gHead, gqFull, gqHead };
const ok = im => im.complete && im.naturalWidth > 0;
const WHO = {
  G: { col: PURPLE, img: gHead, imgShake: gqHead, bg: '#2b2440', right: false },
  O: { col: ORANGE, img: qImg, bg: '#2a2230', right: false },
  F: { col: BLUE, img: fishHead, bg: '#e4f1fd', right: true },
};

// ── 背景与抬头 ──
function background(t) {
  const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#0f1019'); gr.addColorStop(1, '#1d1822');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  for (const s of stars) { g.globalAlpha = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph)); g.fillStyle = s.s > 2 ? '#e3d6ff' : CREAM; g.fillRect(Math.round(s.x), Math.round(s.y), s.s, s.s); }
  g.globalAlpha = 1;
}
function hud(t) {
  g.save(); g.shadowColor = 'rgba(0,0,0,0.9)'; g.shadowBlur = 6;
  g.font = `600 17px ${MONO}`; g.fillStyle = 'rgba(243,237,230,0.78)'; g.textAlign = 'left';
  g.fillText('OJOUSAMA // ' + T('盖章课 #1', '蓋章課 #1'), 20, 28);
  g.textAlign = 'right'; g.font = `600 16px ${FONT}`; g.fillText(T('时间是骰子吗？', '時間是骰子嗎？'), W - 20, 28);
  g.restore(); g.textAlign = 'left';
}

// ── 章 ──
const KIND = { fact: [T('实锤', '實證'), GREEN], hypo: [T('假说', '假說'), GOLD], wild: [T('脑洞', '腦洞'), PINK] };
function stamp(cx, cy, kind, s, scale, rot) {                  // s ＝ 盖下去之后过了几秒；负的 ＝ 还没盖
  if (s < 0) return; const [text, col] = KIND[kind]; scale = scale || 1; rot = rot === undefined ? -0.2 : rot;
  const k = clamp(s / 0.16, 0, 1), z = scale * (1 + (1 - ease(k)) * 1.6), A = GA * clamp(s / 0.08, 0, 1), w = 190, h = 92;
  g.save(); g.translate(cx, cy); g.rotate(rot); g.scale(z, z); g.globalAlpha = A;
  rrect(-w / 2, -h / 2, w, h, 12); g.fillStyle = 'rgba(18,16,24,0.86)'; g.fill(); g.lineWidth = 6; g.strokeStyle = col; g.stroke();
  rrect(-w / 2 + 9, -h / 2 + 9, w - 18, h - 18, 7); g.lineWidth = 2; g.stroke();
  g.font = `900 56px ${FONT}`; g.fillStyle = col; g.textAlign = 'center'; g.fillText(text, 0, 20); g.textAlign = 'left';
  g.restore();
  if (s < 0.35) { g.save(); g.globalAlpha = GA * (1 - s / 0.35) * 0.7; g.strokeStyle = col; g.lineWidth = 4; g.beginPath(); g.ellipse(cx, cy, 108 * scale + s * 260, 58 * scale + s * 150, rot, 0, 6.28); g.stroke(); g.restore(); }
}
function stampNone(cx, cy, s, scale, rot) {                    // 盖不了的章：虚线框 ＋ 问号
  if (s < 0) return; scale = scale || 1; const w = 190, h = 92;
  g.save(); g.translate(cx, cy); g.rotate(rot === undefined ? -0.12 : rot); g.scale(scale, scale); g.globalAlpha = GA * clamp(s / 0.5, 0, 1);
  rrect(-w / 2, -h / 2, w, h, 12); g.setLineDash([14, 10]); g.lineWidth = 5; g.strokeStyle = 'rgba(243,237,230,0.6)'; g.stroke(); g.setLineDash([]);
  g.font = `900 60px ${FONT}`; g.fillStyle = 'rgba(243,237,230,0.6)'; g.textAlign = 'center'; g.fillText('？', 0, 21); g.textAlign = 'left';
  g.restore();
}

// ── 舞台上的零件 ──
const BX = 336, BY = 52, BW = 742, BH = 470, CXB = BX + BW / 2;    // 黑板
const DX = 1092, DY = 56, DW = 176, DH = 234;                       // 盖章台
function panel(x, y, w, h, label, col) {
  rrect(x, y, w, h, 12); g.fillStyle = 'rgba(24,20,30,0.93)'; g.fill();
  g.lineWidth = 3; g.strokeStyle = col; g.stroke();
  if (label) {
    g.font = `800 22px ${FONT}`; const tw = g.measureText(label).width;
    rrect(x + 20, y - 20, tw + 32, 40, 8); g.fillStyle = col; g.fill();
    g.fillStyle = INK; g.fillText(label, x + 36, y + 8);
  }
}
function board(title) { al(1); panel(BX, BY, BW, BH, title, PURPLE); }
function card(x, y, w, h) { rrect(x, y, w, h, 10); g.fillStyle = 'rgba(243,237,230,0.055)'; g.fill(); g.lineWidth = 2; g.strokeStyle = 'rgba(243,237,230,0.22)'; g.stroke(); }
function chip(x, y, text, k, size, col) {                  // 标签；k<1 时弹出来。回传宽度（用当下的透明度画）
  size = size || 26; col = col || ORANGE;
  g.font = `800 ${size}px ${FONT}`; const tw = g.measureText(text).width, w = tw + 36, h = size + 26;
  if (k <= 0) return w;
  const s = back(k); g.save(); g.translate(x + w / 2, y + h / 2); g.scale(s, s);
  rrect(-w / 2, -h / 2, w, h, h / 2); g.fillStyle = 'rgba(18,16,24,0.86)'; g.fill(); g.lineWidth = 3; g.strokeStyle = col; g.stroke();
  g.fillStyle = CREAM; g.textAlign = 'center'; g.fillText(text, 0, size * 0.36); g.textAlign = 'left';
  g.restore(); return w;
}
function dice(x, y, s, n, rot) {
  g.save(); g.translate(x + s / 2, y + s / 2); g.rotate(rot || 0);
  rrect(-s / 2, -s / 2, s, s, s * 0.18); g.fillStyle = CREAM; g.fill(); g.lineWidth = 4; g.strokeStyle = GOLD; g.stroke();
  const pips = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] }[n]; g.fillStyle = INK;
  pips.forEach(i => { g.beginPath(); g.arc((i % 3 - 1) * s * 0.27, (Math.floor(i / 3) - 1) * s * 0.27, s * 0.085, 0, 6.28); g.fill(); });
  g.restore();
}
// 因果集：点一颗一颗长出来，每一颗连到它之前的一两颗
const CP = (() => { const N = 34, pts = []; for (let i = 0; i < N; i++) { const u = 0.06 + 0.88 * rnd(), v = (i + 0.5) / N;
  const links = pts.map((p, j) => [Math.abs(p.u - u) + (i - j) * 0.012, j]).filter(e => i - e[1] <= 10).sort((p, q) => p[0] - q[0]).slice(0, 2).map(e => e[1]);
  pts.push({ u, v, links }); } return pts; })();
function causal(x, y, w, h, k) {
  const n = Math.max(1, Math.round(CP.length * clamp(k, 0, 1))), X = p => x + p.u * w, Y = p => y + h - p.v * h;
  g.lineWidth = 2; g.strokeStyle = 'rgba(169,139,245,0.6)';
  for (let i = 0; i < n; i++) CP[i].links.forEach(j => { g.beginPath(); g.moveTo(X(CP[i]), Y(CP[i])); g.lineTo(X(CP[j]), Y(CP[j])); g.stroke(); });

}
// 客观坍缩：几个「可能」叠在一起，隔一阵子随机剩下一个
function collapse(x, y, w, h, t) {

}
// 被压弯的格线

// 爱因斯坦场方程：G_μν = (8πG / c⁴) T_μν
function fieldEq(cx, y, a) {

  const F1 = `italic 700 50px ${SERIF}`, F2 = `italic 700 26px ${SERIF}`, F3 = `700 30px ${SERIF}`, F4 = `700 19px ${SERIF}`;
  const m = (f, s) => { g.font = f; return g.measureText(s).width; };
  const wG = m(F1, 'G'), wS = m(F2, 'μν'), wEq = m(F1, ' = '), wNum = m(F3, '8πG'), wC = m(F3, 'c'), wDen = wC + m(F4, '4'), wFr = Math.max(wNum, wDen) + 18, wT = m(F1, 'T');

  g.font = F1; g.fillText(' = ', x, y); x += wEq;

  g.fillText('c', x + (wFr - wDen) / 2, y + 14); g.font = F4; g.fillText('4', x + (wFr - wDen) / 2 + wC, y + 2); x += wFr + 16;
  g.fillStyle = GOLD; g.font = F1; g.fillText('T', x, y); g.font = F2; g.fillText('μν', x + wT, y + 12); const xT = x + (wT + wS) / 2;
  tx(T('时空怎么弯', '時空怎麼彎'), xG, y + 42, 17, DIM, 700, 'center'); tx(T('能量和动量', '能量和動量'), xT, y + 42, 17, GOLD, 700, 'center');

// ── 录影 ──
let SAMPLES = [];
async function run() {
  await loadTimeline();
  { const mid = i => LINES[i].at + LINES[i].dur * 0.5, end = i => LINES[i].at + LINES[i].dur * 0.98;
    SAMPLES = [2.6, ...LINES.flatMap((_, i) => [mid(i), end(i)]), OUTRO + 3].sort((a, b) => a - b); }
  await Promise.all([document.fonts.load(`700 36px ${FONT}`), ...Object.values(ALL_IMG).map(im => new Promise(r => im.complete ? r() : (im.onload = im.onerror = r)))]);
  log('images: ' + Object.entries(ALL_IMG).map(([k, im]) => k + '=' + ok(im)).join(' '));
  if (Object.values(ALL_IMG).some(im => !ok(im))) throw new Error('image missing');
  if (QS.has('shots')) {                                       // 快速检查：不录影，只把每个抽样时间点画出来传回去
    for (const s of SAMPLES) { draw(s); await new Promise(r => c.toBlob(b => post('/upload?name=frame_' + s.toFixed(1).padStart(5, '0') + '.png', b).then(r), 'image/png')); }
    thumbnail(); await new Promise(r => c.toBlob(b => post('/upload?name=thumb.png', b).then(r), 'image/png'));
    log('shots=' + SAMPLES.length); await post('/done', 'ok'); return;
  }

  log('audio state=' + ac.state);
  const stream = new MediaStream([...c.captureStream(30).getVideoTracks(), ...dest.stream.getAudioTracks()]);
  const mime = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  log('mime=' + mime);
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 9_000_000, audioBitsPerSecond: 128_000 });
  const chunks = []; rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  const stopped = new Promise(r => rec.onstop = r);
  draw(0); rec.start(1000);
  scheduleMusic(ac.currentTime + 0.05);

  await new Promise(resolve => {
    const frame = now => {

}
